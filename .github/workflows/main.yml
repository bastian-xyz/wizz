name: Sync Google Drive to GitHub

on:
  workflow_dispatch: # Permite ejecutar la sincronización manualmente con un botón
  schedule:
    - cron: '0 * * * *' # Automatización: se ejecuta cada hora

jobs:
  sync-drive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MI_TOKEN_GITHUB }} # Aquí usaremos el token que guardaste en Keep

      - name: Sincronizar con Google Drive
        # Este es el espacio donde conectaremos tu carpeta de Drive usando credenciales de Google
        run: |
          echo "Paso reservado para descargar los archivos desde Google Drive."
          
      - name: Guardar y subir cambios al repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Sincronización automática desde Google Drive" || echo "No hay cambios nuevos"
          git push
          
