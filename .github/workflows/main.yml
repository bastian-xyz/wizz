name: Sincronización Privada Drive a GitHub

on:
  workflow_dispatch: # Botón manual
  schedule:
    - cron: '0 * * * *' # Automático cada hora

jobs:
  sync-drive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # Usamos el token por defecto de GitHub

      - name: Instalar rclone
        # Rclone es la herramienta que nos permite descargar desde Drive por terminal
        run: sudo -v ; curl https://rclone.org/install.sh | sudo bash

      - name: Configurar credenciales seguras
        # Llamamos al secreto que guardaste en el Paso A
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP\_CREDENTIALS }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$GCP\_CREDENTIALS" > /tmp/sa.json
          
          # Creamos el puente apuntando a Google Drive
          cat <<EOF > ~/.config/rclone/rclone.conf
          [mi_drive_cid]
          type = drive
          scope = drive.readonly
          service_account_file = /tmp/sa.json
          EOF

      - name: Descargar archivos desde Drive
        run: |
          # Sincronizamos la carpeta específica (usando tu ID de carpeta)
          # Los archivos se descargarán en la raíz de tu repositorio
          rclone sync mi_drive_cid:1WCSK9XKiKFDtScmZGiEVdi4Ca7obRasi ./ --drive-root-folder-id 1WCSK9XKiKFDtScmZGiEVdi4Ca7obRasi -v --exclude ".git/**" --exclude ".github/**"
          
          # Borramos la llave temporal por seguridad
          rm /tmp/sa.json

      - name: Guardar y actualizar la página web
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Sincronización automática de código desde Drive" || echo "No hay cambios nuevos para subir"
          git push
          
