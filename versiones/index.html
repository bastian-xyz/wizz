<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XYZ MAKER · BASTIAN.XYZ</title>
<!-- app instalable (X,Y,Z) -->
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<meta name="theme-color" content="#0b1119">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="(X,Y,Z)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --negro:#111827; --panel:rgba(22,31,46,.78); --panel-2:rgba(15,76,92,.18);
  --petroleo:#0F4C5C; --petroleo-br:#17738a; --plata:#9CA3AF; --blanco:#F8FAFC;
  --borde:rgba(156,163,175,.25); --ok:#3fb68b; --err:#e06c6c;
  --barra:52px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--negro);color:var(--blanco);font-family:'Montserrat',sans-serif;overflow:hidden}
body{
  background-image:
    linear-gradient(rgba(15,76,92,.42) 1px,transparent 1px),
    linear-gradient(90deg,rgba(15,76,92,.42) 1px,transparent 1px),
    linear-gradient(rgba(15,76,92,.78) 1px,transparent 1px),
    linear-gradient(90deg,rgba(15,76,92,.78) 1px,transparent 1px);
  background-size:8px 8px,8px 8px,40px 40px,40px 40px;
}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}

/* ---------- barra superior ---------- */
#bar{position:fixed;top:0;left:0;right:0;height:var(--barra);z-index:20;display:flex;align-items:center;gap:10px;
  padding:0 12px;background:rgba(11,17,26,.92);border-bottom:1px solid var(--borde);backdrop-filter:blur(8px)}
#home{display:flex;align-items:center;gap:8px;font-weight:900;letter-spacing:2px;font-size:.82rem;white-space:nowrap;padding:6px 8px;border-radius:4px}
#home span{color:var(--petroleo-br)}
#home:hover{background:var(--panel-2)}
#tabs{flex:1;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0}
#tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:6px;height:34px;padding:0 6px 0 10px;border:1px solid var(--borde);border-radius:4px;
  font-size:.66rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;color:var(--plata);flex:none}
.tab svg.ic{width:15px;height:15px}
.tab.on{color:var(--blanco);border-color:var(--petroleo-br);background:var(--panel-2)}
.tab .x{width:20px;height:20px;display:grid;place-items:center;border-radius:3px;opacity:.6}
.tab .x:hover{opacity:1;background:rgba(224,108,108,.2)}
.ibtn{position:relative;width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--borde);border-radius:4px;flex:none}
.ibtn:hover{border-color:var(--petroleo-br);background:var(--panel-2)}
.ibtn svg{width:19px;height:19px}
.dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--plata)}
.dot.on{background:var(--ok);box-shadow:0 0 6px var(--ok)}

/* ---------- inicio ---------- */
#inicio{position:fixed;inset:var(--barra) 0 0 0;overflow-y:auto;padding:34px 16px 60px}
#inicio .wrap{max-width:980px;margin:0 auto}
.hubver{font:inherit;letter-spacing:inherit;color:#7fd3e3;border:1px solid rgba(127,211,227,.35);border-radius:10px;padding:2px 8px;background:rgba(15,76,92,.25)}
.hubver:hover{border-color:#7fd3e3}
#hlogBg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px}
#hlogBg.on{display:flex}
#hlogBox{width:min(580px,100%);max-height:82vh;overflow:auto;background:#0d141f;border:1px solid var(--petroleo-br);border-radius:8px;padding:18px}
#hlogBox h3{display:flex;justify-content:space-between;align-items:center;font-size:.7rem;letter-spacing:3px;margin-bottom:12px}
#hlogBox h4{font-size:.6rem;letter-spacing:2px;color:var(--plata);margin:14px 0 6px}
.hlg{border-left:2px solid var(--petroleo-br);padding:2px 0 10px 12px;margin-bottom:4px}
.hlg b{font-size:.78rem}.hlg time{font-size:.6rem;color:var(--plata);margin-left:8px}
.hlg ul{margin:6px 0 0 16px;font-size:.68rem;line-height:1.6;color:#d6dde6}
.ref{font-size:.55rem;font-weight:700;letter-spacing:3px;color:rgba(156,163,175,.6);display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ref::after{content:'';flex:1;height:1px;background:var(--borde)}
h1{font-size:clamp(1.5rem,4.5vw,2.4rem);font-weight:900;letter-spacing:2px;margin-bottom:28px}
h1 span{color:var(--petroleo-br)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-flow:dense}}
#inicio{z-index:4}  /* la línea de barrido del tema pasa por detrás del tablero */
.card{position:relative;z-index:4;display:flex;flex-direction:column;padding:0;text-align:left;overflow:hidden;
  background:var(--panel);border:1px solid var(--borde);border-radius:8px;backdrop-filter:blur(8px);transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--petroleo-br);transform:translateY(-2px)}
.card.big{grid-column:span 2}
.card.drop{outline:2px dashed #e8b25c;outline-offset:-6px}
.card .art{height:150px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--borde);
  background:radial-gradient(ellipse at 50% 60%,rgba(23,115,138,.16),transparent 70%)}
.card .art svg,.card .art svg *{pointer-events:none}
.card .art svg{width:86%;height:88%;fill:none;stroke:#7fd3e3;stroke-width:1.3;stroke-linejoin:round;stroke-linecap:round}
.card.big .art svg{width:94%}
.card .bd{position:relative;padding:12px 14px 14px;display:flex;flex-direction:column;gap:2px;flex:1}
.card .bd b{display:flex;align-items:center;gap:7px;font-size:.84rem;font-weight:800;letter-spacing:1px;margin-top:4px}
.card .bd b .mi{width:16px;height:16px;color:var(--petroleo-br);flex:none}
.card small{display:block;margin-top:3px;font-size:.62rem;line-height:1.45;color:var(--plata);font-weight:500}
.card .num{font-size:.55rem;font-weight:700;letter-spacing:2px;color:rgba(156,163,175,.55)}
.card .ver{position:absolute;top:12px;right:14px;font-size:.55rem;font-weight:700;letter-spacing:1px;color:#7fd3e3}
.card .go{margin-top:8px;align-self:flex-start;font-size:.58rem;font-weight:700;letter-spacing:1px;color:#e8b25c;border:1px solid rgba(232,178,92,.45);border-radius:3px;padding:4px 8px}
.card.open::after{content:'';position:absolute;top:12px;left:12px;width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok)}
.card.big{background:linear-gradient(120deg,rgba(15,76,92,.40),var(--panel) 55%)}
.card.big .bd b{font-size:1rem;letter-spacing:3px}
/* CUBIK: piezas que se anidan en la plancha */
.art.nestc .sheet{fill:rgba(127,211,227,.05);stroke:#7fd3e3}
.art.nestc .grid8{stroke:#7fd3e3;stroke-opacity:.12;stroke-width:.8}
.art.nestc .pz{fill:rgba(127,211,227,.14);opacity:0;animation:nz-in 7s ease-out infinite}
.art.nestc .pz circle{fill:#0d141f}
.art.nestc .p1{--x:-40px;--y:-30px;animation-delay:0s}.art.nestc .p2{--x:0;--y:-40px;animation-delay:.35s}.art.nestc .p3{--x:40px;--y:-30px;animation-delay:.7s}
.art.nestc .p4{--x:-40px;--y:30px;animation-delay:1.05s}.art.nestc .p5{--x:0;--y:40px;animation-delay:1.4s}.art.nestc .p6{--x:40px;--y:30px;animation-delay:1.75s}
@keyframes nz-in{0%{opacity:0;transform:translate(var(--x),var(--y))}12%,88%{opacity:1;transform:none}100%{opacity:0;transform:none}}
.art.nestc .laser{fill:#ffd27a;stroke:none;filter:drop-shadow(0 0 4px #e8b25c)}
.art.nestc .tag rect{fill:rgba(232,178,92,.18);stroke:#e8b25c;stroke-width:.8}
.art.nestc .tag text{fill:#e8b25c;stroke:none;font:700 7px Montserrat,sans-serif;letter-spacing:1px}
.art.nestc .tag{animation:nz-tag 7s ease-out infinite}
@keyframes nz-tag{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}
.card:hover .art.nestc .pz,.card:hover .art.nestc .tag{animation-duration:3.5s}
/* DRAFT: dibujo que se traza con cotas y panel de comandos */
.art.drft .gridd{stroke:#7fd3e3;stroke-opacity:.07;stroke-width:.7}
.art.drft .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:dr-ln 8s ease-in-out infinite}
.art.drft .l2{animation-delay:.6s}.art.drft .l3{animation-delay:1.1s}.art.drft .l4{animation-delay:1.5s}
@keyframes dr-ln{0%{stroke-dashoffset:1}22%,86%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.art.drft .dim{stroke:#e8b25c;stroke-width:.9;opacity:0;animation:dr-dim 8s ease-out infinite}
.art.drft .dim text{fill:#e8b25c;stroke:none;font:700 8px Montserrat,sans-serif;text-anchor:middle}
.art.drft .d2{animation-delay:.4s}.art.drft .d3{animation-delay:.8s}
@keyframes dr-dim{0%,28%{opacity:0}36%,86%{opacity:1}100%{opacity:0}}
.art.drft .cur{stroke:#ffd27a;stroke-width:1;animation:dr-cur 8s ease-in-out infinite}
@keyframes dr-cur{0%{transform:translate(70px,112px)}8%{transform:translate(70px,44px)}12%{transform:translate(100px,20px)}16%{transform:translate(220px,20px)}20%{transform:translate(250px,44px)}24%{transform:translate(250px,112px)}32%{transform:translate(184px,70px)}44%{transform:translate(262px,80px)}60%{transform:translate(206px,30px)}86%,100%{transform:translate(160px,126px)}}
.art.drft .panel rect{fill:rgba(13,20,31,.75);stroke:#7fd3e3;stroke-opacity:.5}
.art.drft .pi{stroke:#9CA3AF;stroke-width:1.1}
.art.drft .panel text{fill:#9CA3AF;stroke:none;font:700 6.5px Montserrat,sans-serif;letter-spacing:1px}
.card:hover .art.drft .pi{stroke:#7fd3e3}
/* Herramientas extras: mandala que gira y perforado con gradiente */
.art.genx .mand{transform:translate(70px,70px)}
.art.genx .ring{fill:rgba(127,211,227,.10);stroke:#7fd3e3;stroke-width:1}
.art.genx .r1{animation:gx-rot 24s linear infinite}.art.genx .r2{animation:gx-rot 36s linear infinite reverse}
@keyframes gx-rot{to{transform:rotate(360deg)}}
.art.genx .perf circle{fill:#7fd3e3;stroke:none;animation:gx-pulse 3s ease-in-out infinite;animation-delay:var(--d)}
@keyframes gx-pulse{0%,100%{opacity:.35}50%{opacity:1}}
.card:hover .art.genx .r1{animation-duration:6s}.card:hover .art.genx .r2{animation-duration:9s}
.card .art.crate svg{stroke:#e8b25c;stroke-width:1.4}
.card .art.crate .w{stroke:#c98f3e;stroke-width:1}
.card .art.crate .pl{fill:rgba(156,163,175,.55);stroke:#cbd5e1;stroke-width:.8}
.card .art.crate .sh{fill:rgba(0,0,0,.35);stroke:none;transform-origin:110px 132px;animation:cr-sh 2.6s ease-in-out infinite}
.card .art.crate .bx{animation:cr-bob 2.6s ease-in-out infinite}
@keyframes cr-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes cr-sh{0%,100%{transform:scaleX(1);opacity:1}50%{transform:scaleX(.9);opacity:.7}}
@keyframes cr-hop{from{transform:translateY(0) rotate(0)}to{transform:translateY(-9px) rotate(-1.5deg)}}
@media (prefers-reduced-motion:reduce){.card .art.crate .bx,.card .art.crate .sh{animation:none}}
.card .art.furn svg{stroke:#7fd3e3;stroke-width:1}
.card .art.furn .fc{fill:rgba(127,211,227,.10);stroke:#7fd3e3}
.card .art.furn .fc0{fill:rgba(127,211,227,.18)}.card .art.furn .fc2{fill:rgba(127,211,227,.06)}
.card .art.furn .hd{fill:none;stroke:#7fd3e3;stroke-opacity:.35;stroke-dasharray:2 2}
.card .art.furn .tb{fill:rgba(232,178,92,.35);stroke:#e8b25c;stroke-width:.8}
.card .art.furn .sh{fill:rgba(0,0,0,.35);stroke:none}
.card .art.furn .pn{animation:fx-ex 5s ease-in-out infinite}
@keyframes fx-ex{0%,22%,100%{transform:translate(0,0)}46%,76%{transform:translate(var(--tx),var(--ty))}}
@keyframes fx-hold{to{transform:translate(var(--tx),var(--ty))}}
@media (prefers-reduced-motion:reduce){.card .art.furn .pn{animation:none;transform:translate(calc(var(--tx)*.6),calc(var(--ty)*.6))}}
.card .art.tray svg path{stroke-linejoin:round}
.card:hover .art.crate .bx{animation:cr-hop .5s cubic-bezier(.3,.7,.4,1) infinite alternate}
.card:hover .art.furn .pn{animation:fx-hold .6s ease-out forwards}
.card .art.tray svg path{stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){.art.nestc .pz,.art.nestc .tag{animation:none;opacity:1}.art.drft .ln{animation:none;stroke-dashoffset:0}.art.drft .dim{animation:none;opacity:1}.art.drft .cur{display:none}.art.genx .ring,.art.genx .perf circle{animation:none}}

/* ---------- vistas de herramientas ---------- */
#vistas{position:fixed;inset:var(--barra) 0 0 0;display:none;z-index:4}   /* sobre la línea de escaneo del hub: cada herramienta trae la suya */
#vistas iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--negro);display:none}
#vistas iframe.on{display:block}
#carga{position:fixed;inset:var(--barra) 0 0 0;display:none;place-items:center;font-size:.62rem;letter-spacing:3px;color:var(--plata);z-index:5}
#carga.on{display:grid}

/* ---------- panel Drive ---------- */
#velo{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:29;opacity:0;pointer-events:none;transition:opacity .2s}
#velo.on{opacity:1;pointer-events:auto}
#drive{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);z-index:30;display:flex;flex-direction:column;
  background:#0d141f;border-left:1px solid var(--borde);transform:translateX(100%);transition:transform .25s}
#drive.on{transform:none}
.dhead{display:flex;align-items:center;gap:10px;height:var(--barra);padding:0 12px 0 16px;border-bottom:1px solid var(--borde)}
.dhead b{flex:1;font-size:.72rem;letter-spacing:3px;font-weight:800}
.dbody{flex:1;overflow-y:auto;padding:16px}
.quien{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--borde);border-radius:6px;margin-bottom:14px;font-size:.66rem}
.quien img{width:28px;height:28px;border-radius:50%}
.quien span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--plata)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:4px;
  font-size:.66rem;font-weight:800;letter-spacing:2px;text-transform:uppercase;border:1px solid var(--petroleo-br);background:var(--petroleo)}
.btn:hover{background:var(--petroleo-br)}
.btn.sec{background:transparent;border-color:var(--borde)}
.btn.sec:hover{border-color:var(--petroleo-br);background:var(--panel-2)}
.btn.w{width:100%}
.btn svg{width:16px;height:16px}
.zona{border:1.5px dashed var(--borde);border-radius:6px;padding:20px;text-align:center;font-size:.62rem;letter-spacing:1px;color:var(--plata);margin-bottom:14px;cursor:pointer}
.zona.sobre,.zona:hover{border-color:var(--petroleo-br);color:var(--blanco);background:var(--panel-2)}
.zona svg{width:26px;height:26px;margin:0 auto 8px;color:var(--petroleo-br)}
.filtro{display:flex;gap:8px;margin-bottom:10px}
.filtro input{flex:1;min-width:0;height:36px;padding:0 10px;border-radius:4px;border:1px solid var(--borde);background:rgba(11,17,26,.6);color:var(--blanco);font:inherit;font-size:.72rem}
.filtro input:focus{outline:none;border-color:var(--petroleo-br)}
.lista{display:flex;flex-direction:column;gap:6px}
.arch{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--borde);border-radius:5px;background:var(--panel)}
.arch .ext{width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:4px;background:var(--panel-2);
  font-size:.52rem;font-weight:800;letter-spacing:1px;color:var(--petroleo-br);text-transform:uppercase}
.arch .inf{flex:1;min-width:0}
.arch .inf b{display:block;font-size:.7rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arch .inf small{display:block;font-size:.58rem;color:var(--plata);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arch .acc{display:flex;gap:4px}
.arch.carp{width:100%;text-align:left;cursor:pointer;color:inherit;font:inherit}
.arch.carp:hover{border-color:var(--petroleo-br)}
.arch.carp .ext{color:var(--petroleo-br)}
.arch .ir{color:var(--plata);font-size:1rem;padding:0 6px}
.ruta{font-size:.62rem;color:var(--plata);margin:-2px 0 8px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.ruta button{color:var(--petroleo-br);font:inherit;font-weight:700;padding:2px 0}
.ruta button:hover{text-decoration:underline}
.adj .auto{flex-basis:100%;display:grid;gap:5px;padding:10px 12px;border:1px dashed var(--petroleo-br);border-radius:5px;background:rgba(15,76,92,.12);font-size:.62rem;color:var(--plata)}
.adj .auto b{color:var(--blanco);font-size:.64rem;letter-spacing:.5px}
.adj .auto span{display:flex;gap:6px;align-items:flex-start;background:none;border:0;padding:0}
.adj .auto svg{flex:none;margin-top:1px;color:var(--petroleo-br)}
.arch .acc button{width:32px;height:32px;display:grid;place-items:center;border-radius:4px;color:var(--plata)}
.arch .acc button:hover{background:var(--panel-2);color:var(--blanco)}
.arch .acc svg{width:16px;height:16px}
.msg{font-size:.64rem;color:var(--plata);text-align:center;padding:18px 6px;line-height:1.6}
.msg.err{color:var(--err)}
.intro{font-size:.68rem;line-height:1.7;color:var(--plata);margin-bottom:18px}
#aviso{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);z-index:40;padding:10px 16px;border-radius:5px;
  background:rgba(13,20,31,.97);border:1px solid var(--petroleo-br);font-size:.66rem;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100% - 32px)}
#aviso.on{opacity:1;transform:translate(-50%,0)}
#aviso.err{border-color:var(--err)}

/* ---------- pedidos ---------- */
.ibtn .cnt{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--petroleo-br);font-size:.58rem;font-weight:800;display:grid;place-items:center}
.ibtn .cnt:empty{display:none}
#btnInstalar.act svg{transition:transform .6s}
#btnInstalar.act.nueva{border-color:var(--petroleo-br);box-shadow:0 0 0 3px rgba(23,115,138,.25);animation:nuevaV 1.6s ease-in-out infinite}
@keyframes nuevaV{50%{box-shadow:0 0 0 6px rgba(23,115,138,.05)}}
#btnInstalar.act.gira svg{transform:rotate(360deg)}
#btnAdjuntar{display:none;height:38px;padding:0 12px;border-radius:4px;border:1px solid var(--petroleo-br);background:transparent;font-size:.62rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;align-items:center;gap:6px;flex:none}
#btnAdjuntar.on{display:inline-flex}
#btnAdjuntar:hover{background:rgba(23,115,138,.25)}
#btnAdjuntar svg{width:15px;height:15px}
#btnPublicar{display:none;height:38px;padding:0 12px;border-radius:4px;border:1px solid var(--petroleo-br);background:var(--petroleo);font-size:.62rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;align-items:center;gap:6px;flex:none}
#btnPublicar.on{display:inline-flex}
#btnPublicar:hover{background:var(--petroleo-br)}
#btnPublicar svg{width:16px;height:16px}
.resumen{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kpi{padding:12px 14px;text-align:left;background:var(--panel);border:1px solid var(--borde);border-left:3px solid var(--c);border-radius:6px}
.kpi:hover{border-color:var(--petroleo-br);border-left-color:var(--c)}
.kpi b{display:block;font-size:1.4rem;font-weight:900;font-variant-numeric:tabular-nums;color:var(--c)}
.kpi span{font-size:.56rem;font-weight:700;letter-spacing:2px;color:var(--plata);text-transform:uppercase}
#pedidosV{position:fixed;inset:var(--barra) 0 0 0;overflow:auto;padding:24px 16px 60px;display:none}
#pedidosV .wrap{max-width:1200px;margin:0 auto}

<style>
/* =========================================
   theme.css - BASTIAN.XYZ C.I.D. MASTER THEME
   ========================================= */


:root {
  /* PALETA MAESTRA C.I.D. */
  --cid-negro: #111827;
  --cid-panel: rgba(22, 31, 46, 0.70);
  --cid-panel-soft: rgba(15, 76, 92, 0.20);
  --cid-petroleo: #0F4C5C;
  --cid-petroleo-br: #17738a;
  --cid-plata: #9CA3AF;
  --cid-blanco: #F8FAFC;
  --cid-border: rgba(156, 163, 175, 0.25);

  /* 1. MAPPING GENERAL (Variables compartidas en tus herramientas) */
  --bg: var(--cid-negro);
  --bg-base: var(--cid-negro);
  --bg2: var(--cid-panel-soft);
  --surface: var(--cid-panel);
  --surface2: var(--cid-panel-soft);
  --panel: var(--cid-panel);
  --panel-2: var(--cid-panel-soft);
  --bg-panel: var(--cid-panel);
  --bg-input: rgba(11, 17, 26, 0.6);

  --border: var(--cid-border);
  --border-soft: rgba(156, 163, 175, 0.1);
  --line: var(--cid-border);
  --panel-line: var(--cid-border);

  --text: var(--cid-blanco);
  --text-main: var(--cid-blanco);
  --muted: var(--cid-plata);
  --text-muted: var(--cid-plata);
  --muted2: rgba(156, 163, 175, 0.5);
  --text-dim: var(--cid-plata);

  /* 2. OVERRIDE DE COLORES DE ACENTO (Unificando a tonos petróleo/plata) */
  --brass: var(--cid-petroleo-br);
  --brass-dim: var(--cid-petroleo);
  --amber: var(--cid-petroleo-br);
  --amber-dim: var(--cid-petroleo);
  --cyan: var(--cid-plata); 
  --cyan-dim: rgba(156,163,175,.3);
  --accent: var(--cid-petroleo-br);
  --accent-dim: var(--cid-petroleo);
  --amber-glow: rgba(15, 76, 92, 0.25);
  --accent-glow: rgba(23, 115, 138, 0.25);
  --grid-minor: rgba(15, 76, 92, 0.42);
  --grid-major: rgba(15, 76, 92, 0.78);
}

/* 3. FONDO GLOBAL (LA MALLA TÉCNICA C.I.D.) */
body {
  background-color: var(--cid-negro) !important;
  background-image:
    linear-gradient(rgba(15,76,92,.42) 1px, transparent 1px),
    linear-gradient(90deg, rgba(15,76,92,.42) 1px, transparent 1px),
    linear-gradient(rgba(15,76,92,.78) 1px, transparent 1px),
    linear-gradient(90deg, rgba(15,76,92,.78) 1px, transparent 1px) !important;
  background-size: 8px 8px, 8px 8px, 40px 40px, 40px 40px !important;
  background-attachment: fixed !important;
  font-family: 'Montserrat', sans-serif !important;
  position: relative;
}

body::before,
body::after {
  content: "";
  position: fixed;
  pointer-events: none;
}

body::before {
  inset: 0;
  z-index: 0;
  background: radial-gradient(ellipse at 50% 46%, transparent 35%, rgba(0,0,0,.65) 100%);
}

body::after {
  top: -20px;
  left: 0;
  right: 0;
  height: 2px;
  opacity: 0.7;
  z-index: 3;
  background: linear-gradient(90deg, transparent, rgba(156,163,175,.45), transparent);
  animation: cid-scan 8s linear infinite;
}

@keyframes cid-scan {
  0% { transform: translateY(-12px); opacity: 0; }
  15% { opacity: 0.8; }
  100% { transform: translateY(100vh); opacity: 0.2; }
}

html, body {
  min-height: 100%;
}

body > * {
  position: relative;
  z-index: 1;
}

/* Limpiar gradientes sólidos de algunas herramientas para que se vea la malla */
.main, .workspace, .layout {
  background: transparent !important;
}

/* 4. EFECTO CRISTAL (GLASSMORPHISM) PARA PANELES */
.card, .panel, .control-section,
.sidebar, .footer, .hud-corner, #textPanel, #layersPanel,
.score-card, .analysis-card, .big-line, .preview {
  background-color: var(--cid-panel) !important;
  backdrop-filter: blur(8px) !important;
  -webkit-backdrop-filter: blur(8px) !important;
  border-color: var(--cid-border) !important;
}

header {
  background-color: transparent !important;
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
}

/* 5. TIPOGRAFÍA EN BOTONES Y TÍTULOS */
h1, h2, h3, button, .brand, .tab, .toggle {
  font-family: 'Montserrat', sans-serif !important;
}

</style>

const PUENTE = "/* puente de carga: dentro de cada herramienta, avisa al hub de lo que hace esperar */\n(function(){\n  var P = null; try{ P = parent && parent !== window && parent.CARGA; }catch(e){}\n  if(!P) return; window.CARGA = P;\n  var NOM = {jspdf:'librer\u00eda de PDF', three:'motor 3D', OrbitControls:'controles 3D', TransformControls:'controles 3D', GLTFExporter:'exportador 3D', clipper:'motor de geometr\u00eda', opentype:'motor de fuentes', 'occt-import-js':'motor STEP', xlsx:'lector de Excel'};\n  function nombreLib(src){ var f = (src.split('/').pop() || '').replace(/\\?.*$/, ''); for(var k in NOM) if(src.indexOf(k) >= 0) return NOM[k]; return f.replace(/(\\.umd)?(\\.min)?(\\.full)?\\.js$/, '') || 'motor'; }\n  var of = window.fetch;\n  if(of) window.fetch = function(){ var t = P.inicio('Descargando datos\u2026', 0); return of.apply(this, arguments).then(function(r){ t.fin(); return r; }, function(e){ t.fin(); throw e; }); };\n  function vigilaScript(n){ if(n.tagName !== 'SCRIPT' || !n.src || n.__cg) return; n.__cg = 1;\n    var t = P.inicio('Descargando ' + nombreLib(n.src) + '\u2026', 0), f = function(){ t.fin(); };\n    n.addEventListener('load', f); n.addEventListener('error', f); setTimeout(f, 30000); }\n  new MutationObserver(function(ms){ ms.forEach(function(m){ m.addedNodes.forEach(vigilaScript); }); })\n    .observe(document.documentElement, {childList: true, subtree: true});\n  var act = null;\n  function txt(){ var e = document.getElementById('busyT') || document.querySelector('.busy-msg'); return (e && e.textContent.trim()) || 'Procesando\u2026'; }\n  function sub(){ var e = document.getElementById('busyS') || document.querySelector('.busy-sub'); return (e && e.textContent) || ''; }\n  function rev(){\n    var b = document.getElementById('busy');\n    var on = (b && !b.classList.contains('hide')) || !!document.querySelector('.busy-ov');\n    if(on && !act) act = P.inicio(txt(), 2, {nav: false});\n    if(on && act){ act.texto(txt()); var m = /(\\d+)\\s*%/.exec(sub()); if(m) act.real(+m[1] / 100); }\n    if(!on && act){ act.fin(); act = null; }\n  }\n  function obs(){ new MutationObserver(rev).observe(document.body, {childList: true, subtree: true, attributes: true, attributeFilter: ['class'], characterData: true}); rev(); }\n  if(document.body) obs(); else document.addEventListener('DOMContentLoaded', obs);\n  window.addEventListener('pagehide', function(){ if(act){ act.fin(); act = null; } });\n})();\n";

  function draw(A,B,lift,glowA,glowB){const F=geo(A,B),faces=F.filter(f=>f.pts),bends=F.filter(f=>f.bend);

    faces.forEach(f=>{f.z=f.pts.reduce((s,p)=>s+p[0]+p[1]+p[2]*1.2,0)/4;});faces.sort((x,y)=>x.z-y.z);
    const cb=pr([L/2,W/2,0],s,ox,oy),sc=1-lift/40;
    let o='<ellipse cx="'+cb[0].toFixed(1)+'" cy="'+(cb[1]+(L+W)*.25*s+4).toFixed(1)+'" rx="'+((L+W)*C*s*.42*sc).toFixed(1)+'" ry="'+(5*sc).toFixed(1)+'" fill="rgba(0,0,0,'+(.32*sc).toFixed(2)+')" stroke="none"/>';
    faces.forEach(f=>{const n=nrm(f.pts),li=Math.abs(n[0]*.35+n[1]*.55+n[2]*.76),up=Math.min(1,Math.max(0,(f.pts[2][2]+f.pts[3][2])/2/h));
      const al=(f.k==='base'?.20:.10+li*.14+.08*up).toFixed(3);
      o+='<path d="M'+f.pts.map(p=>fmt(pr(p,s,ox,oyl))).join('L')+'z" fill="rgba(127,211,227,'+al+')" stroke="#7fd3e3" stroke-width="1.2"/>';});
    bends.forEach(f=>{const g=(f.lip?glowB:glowA)[f.i];
      o+='<path d="M'+fmt(pr(f.bend[0],s,ox,oyl))+'L'+fmt(pr(f.bend[1],s,ox,oyl))+'" stroke="'+(g>.05?'#ffd27a':'#e8b25c')+'" stroke-width="'+(1+g*1.6).toFixed(2)+'" stroke-dasharray="3 2.5" stroke-opacity="'+(.75+g*.25).toFixed(2)+'"'+(g>.05?' style="filter:drop-shadow(0 0 '+(g*3).toFixed(1)+'px #e8b25c)"':'')+'/>';});
    svg.innerHTML=o;}
  const clamp=x=>x<0?0:x>1?1:x, smooth=x=>{x=clamp(x);return x*x*(3-2*x);};
  const back=x=>{x=clamp(x);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};  // con rebote
  const bell=x=>x<=0||x>=1?0:Math.sin(Math.PI*x);
  // secuencia escalonada: cada lado empieza un poco después del anterior
  function seq(T,spring){const A=[],B=[],gA=[],gB=[],ord=[3,0,1,2];
    for(let k=0;k<4;k++){const i=ord[k],ta=(T-k*.16)/.55,tb=(T-.85-k*.13)/.45,f=spring?back:smooth;
      A[i]=f(ta)*PI2;B[i]=f(tb)*PI2;gA[i]=bell(ta);gB[i]=bell(tb);}
    return [A,B,gA,gB];}
  let hov=false,tH=0,tLoop=performance.now(),last=null,lastOut=0;
  card.addEventListener('mouseenter',()=>{hov=true;tH=performance.now();});
  card.addEventListener('mouseleave',()=>{hov=false;lastOut=performance.now();tLoop=performance.now()-3600;});   // sale plegada y luego se abre
  function frame(now){if(!artOn()){requestAnimationFrame(frame);return;}let A,B,gA,gB,lift=0;
    if(hov){const T=(now-tH)/1000;
      if(T<.35){ // se aplana rápido para volver a plegarse
        const k=1-smooth(T/.35),c=last||[F4,F4];A=c[0].map(x=>x*k);B=c[1].map(x=>x*k);gA=Z4;gB=Z4;lift=bell(T/.7)*4;}
      else{[A,B,gA,gB]=seq((T-.35)*1.6,true);const Tf=T-.35-1.9/1.6;lift=Tf>0?2+Math.sin(Tf*2.4)*2.2:bell((T-.35)/1.4)*6;}}
    else{const T=((now-tLoop)/1000)%7;
      if(T<5.6){[A,B,gA,gB]=seq(T-.6,false);}
      else{const k=1-smooth((T-5.6)/1.2);A=F4.map(x=>x*k);B=F4.map(x=>x*k);gA=Z4;gB=Z4;}}
    last=[A,B];draw(A,B,lift,gA,gB);requestAnimationFrame(frame);}
  if(red){draw(F4,F4,0,Z4,Z4);}else requestAnimationFrame(frame);
})();
}

const abiertas = new Map();   // id -> {frame, url}

const HTML_CACHE = {};
async function htmlDe(t){   // descompresor propio en JS: no depende del navegador (DecompressionStream se quedaba pegado en algunos equipos)
  if(HTML_CACHE[t.src]) return HTML_CACHE[t.src];
  await new Promise(r => setTimeout(r, 0));   // deja pintar la tarjeta «Procesando» antes
  const bin = Uint8Array.from(atob(SRC[t.src]), c => c.charCodeAt(0));
  return HTML_CACHE[t.src] = new TextDecoder().decode(gunzipRespaldo(bin));
}
async function abrir(id){
  const t = TOOLS.find(x => x.id === id); if(!t) return;
  if(!abiertas.has(id)){
    const tk = CARGA.inicio('Abriendo '+t.name+'…', 3);
    try{
      tk.texto('Abriendo '+t.name+' · preparando…');
      let html = await htmlDe(t); tk.real(.25).texto('Abriendo '+t.name+' · iniciando…');
      html = html.replace('<head>', () => '<head><script>'+PUENTE+'<\/script>');
      // librerías de PDF sin bloquear: la herramienta se muestra aunque el CDN esté lento (se cargan solas al necesitarlas)
      html = html.replace(/<script src="(https:\/\/cdnjs\.cloudflare\.com\/ajax\/libs\/jspdf\/[^"]+)"><\/script>/g, '<script async src="$1"><\/script>');
      if(t.embed) html = html.replace('<head>', `<head><script>window.XYZ_EMBED=${JSON.stringify(t.embed)};<\/script>`);
      const themeURL = new URL('theme.css', location.href).href;   // tema del repo en carga diferida: la herramienta no lo espera
      html = html.includes('</head>') ? html.replace('</head>', `<link rel="stylesheet" href="${themeURL}" media="print" onload="this.media='all'">\n</head>`) : html;
      // srcdoc en vez de blob: algunos Chrome de escritorio bloquean los iframes blob: y la herramienta quedaba en blanco
      const url = null;
      const f = document.createElement('iframe');
      f.title = t.name; f.srcdoc = html;
      f.setAttribute('allow','clipboard-read; clipboard-write; fullscreen');
      // lista apenas la herramienta se puede usar (documento interactivo), sin esperar fuentes ni descargas secundarias
      const listo = new Promise(ok => {
        let hecho = false; const fin = () => { if(hecho) return; hecho = true; clearInterval(iv); ok(f); };
        f.addEventListener('load', fin, {once:true});
        const iv = setInterval(() => { try{ const d = f.contentDocument; if(d && d.URL === 'about:srcdoc' && d.readyState !== 'loading') fin(); }catch(e){} }, 80);
      });
      tk.real(.45); listo.then(() => tk.fin()); setTimeout(() => tk.fin(), 25000);
      $('#vistas').appendChild(f);
      abiertas.set(id, {frame:f, url, listo});
      setTimeout(() => { const v = abiertas.get(id); if(v && !v.cargado) aviso(t.name+' está tardando en cargar · revisa la conexión', true); }, 20000);
      listo.then(() => { const v = abiertas.get(id); if(v) v.cargado = true; });
    }catch(err){ tk.fin(); aviso('No se pudo abrir '+t.name+': '+(err && err.message || err), true); console.error(err); return; }
  }
  mostrar(id);
  return abiertas.get(id).listo;
}

      const renov = !!(usuario && recordado);   // renovación silenciosa: no repite la entrada completa
      token = r.access_token; tokenVence = Date.now() + (r.expires_in - 60)*1000;
      $('#dotDrive').classList.add('on');
      try{ const u = await (await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+token}})).json(); if(u && u.email) usuario = u; }catch(e){}

async function api(url, opt={}){
  if(!token || Date.now() > tokenVence){ token=null; $('#dotDrive').classList.remove('on'); throw new Error('sesion'); }
  const r = await fetch(url, {...opt, headers:{...(opt.headers||{}), Authorization:'Bearer '+token}});
  if(r.status === 401){ token=null; $('#dotDrive').classList.remove('on'); throw new Error('sesion'); }
  if(!r.ok){ let m=r.status; try{ m=(await r.json()).error.message; }catch(e){} throw new Error(m); }
  return r;
}

function errSesion(e){
  if(e.message==='sesion'){ pintarDrive(); aviso('La sesión venció, entra de nuevo', true); return true; }
  return false;
}
async function listar(){
  try{
    const q = encodeURIComponent(`'${CFG.carpeta}' in parents and trashed=false`);
    const campos = encodeURIComponent('nextPageToken,files(id,name,mimeType,size,modifiedTime,webViewLink,lastModifyingUser(displayName))');
    let todos=[], pt='';
    do{
      const r = await api(`${API}/files?q=${q}&fields=${campos}&orderBy=modifiedTime desc&pageSize=200&supportsAllDrives=true&includeItemsFromAllDrives=true${pt?'&pageToken='+pt:''}`);
      const j = await r.json(); todos = todos.concat(j.files||[]); pt = j.nextPageToken||'';
    }while(pt);
    archivos = todos; pintarLista();
  }catch(e){
    if(errSesion(e)) return;
    const l=$('#lista'); if(l) l.innerHTML = `<p class="msg err">No se pudo leer la carpeta.<br>${esc(e.message)}</p>`;
  }
}
async function subir(files){
  if(!files.length) return;
  if(!token){ entrar(() => subir(files)); return; }
  let ok=0;
  for(const f of files){
    aviso(`Subiendo ${f.name}…`);
    try{
      const meta = {name:f.name, parents:[CFG.carpeta]};
      const fd = new FormData();
      fd.append('metadata', new Blob([JSON.stringify(meta)],{type:'application/json'}));
      fd.append('file', f);
      await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&supportsAllDrives=true', {method:'POST', body:fd});
      ok++;
    }catch(e){ if(errSesion(e)) return; aviso(`Error con ${f.name}: ${e.message}`, true); }
  }
  if(ok) aviso(ok===1 ? 'Archivo subido' : `${ok} archivos subidos`);
  listar();
}
async function bajar(id){
  const a = archivos.find(x => x.id===id); if(!a) return;
  try{
    aviso(`Descargando ${a.name}…`);
    const r = await api(`${API}/files/${id}?alt=media&supportsAllDrives=true`);
    const url = URL.createObjectURL(await r.blob());
    const el = Object.assign(document.createElement('a'), {href:url, download:a.name});
    document.body.appendChild(el); el.click(); el.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }catch(e){ if(!errSesion(e)) aviso('No se pudo descargar: '+e.message, true); }
}

const ahora = () => new Date().toISOString();
const fechaL = s => new Date(s).toLocaleString('es-CL',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});
const avance = p => { let h=0,t=0; (p.piezas||[]).forEach(z => { const q=+z.q||1; t+=q; if(z.ok) h+=q; }); return [h,t]; };

async function pedLeer(){
  const q = encodeURIComponent(`name='pedidos.json' and '${CFG.carpeta}' in parents and trashed=false`);
  const j = await (await api(`${API}/files?q=${q}&fields=files(id)&supportsAllDrives=true&includeItemsFromAllDrives=true`)).json();
  if(j.files && j.files.length){
    PED.fileId = j.files[0].id;
    const d = await (await api(`${API}/files/${PED.fileId}?alt=media&supportsAllDrives=true`)).json();
    PED.data = Object.assign({v:1, seq:{}, pedidos:[]}, d);
  } else { PED.fileId = null; PED.data = {v:1, seq:{}, pedidos:[]}; }
  PED.cargado = true; PED.error = '';
}
async function pedGuardar(){
  const body = JSON.stringify(PED.data, null, 1);
  if(PED.fileId){
    await api(`https://www.googleapis.com/upload/drive/v3/files/${PED.fileId}?uploadType=media&supportsAllDrives=true`, {method:'PATCH', headers:{'Content-Type':'application/json'}, body});
  } else {
    const fd = new FormData();
    fd.append('metadata', new Blob([JSON.stringify({name:'pedidos.json', parents:[CFG.carpeta], mimeType:'application/json'})], {type:'application/json'}));
    fd.append('file', new Blob([body], {type:'application/json'}));
    PED.fileId = (await (await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&supportsAllDrives=true&fields=id', {method:'POST', body:fd})).json()).id;
  }
}
let cola = Promise.resolve();
/* Relee la última versión, aplica el cambio y guarda: así no se pisan cambios del resto del equipo */
function mutar(fn){
  const p = cola.then(async () => { await pedLeer(); const r = fn(PED.data); await pedGuardar(); pintarPedidos(); return r; });
  cola = p.catch(() => {});
  return p;
}
async function cargarPedidos(){
  if(!sesionOk()){ pintarPedidos(); return; }
  try{ await pedLeer(); }catch(e){ if(!errSesion(e)) PED.error = e.message; }
  pintarPedidos();
}
async function crearCarpeta(nombre, padre){
  const r = await api(`${API}/files?supportsAllDrives=true&fields=id`, {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name:nombre, mimeType:'application/vnd.google-apps.folder', parents:[padre||CFG.carpeta]})});
  return (await r.json()).id;
}
async function subirA(file, parent){
  const fd = new FormData();
  fd.append('metadata', new Blob([JSON.stringify({name:file.name, parents:[parent]})], {type:'application/json'}));
  fd.append('file', file);
  const r = await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&supportsAllDrives=true&fields=id,name', {method:'POST', body:fd});
  try{ return await r.json(); }catch(e){ return {}; }
}
async function listarEn(parent){
  const q = encodeURIComponent(`'${parent}' in parents and trashed=false`);
  const f = encodeURIComponent('files(id,name,mimeType,size,modifiedTime,webViewLink)');
  return (await (await api(`${API}/files?q=${q}&fields=${f}&orderBy=modifiedTime desc&supportsAllDrives=true&includeItemsFromAllDrives=true`)).json()).files || [];
}

/* ---------- pintado ---------- */
function pintarResumen(){
  const r = $('#resumen'); if(!r) return;
  const ps = PED.data.pedidos;
  r.innerHTML = ESTADOS.map(([k,l,c]) => `<button class="kpi" data-ir-pedidos style="--c:${c}"><b>${PED.cargado ? ps.filter(p=>p.estado===k).length : '—'}</b><span>${l}</span></button>`).join('');
}
function pintarPedidos(){
  const activos = PED.data.pedidos.filter(p => p.estado!=='listo').length;
  $('#cntPed').textContent = PED.cargado && activos ? activos : '';
  pintarResumen();
  const b = $('#pedBody');
  if(!sesionOk()){
    b.innerHTML = `<p class="intro" style="max-width:420px">Los pedidos viven en la carpeta compartida. Entra con tu cuenta Google para verlos.</p>
      <button class="btn" data-entrar><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>Entrar con Google</button>`;
  } else if(PED.error){
    b.innerHTML = `<p class="msg err">No se pudieron leer los pedidos.<br>${esc(PED.error)}</p>`;
  } else if(!PED.cargado){
    b.innerHTML = '<p class="msg">Cargando…</p>';
  } else {
    const ps = [...PED.data.pedidos].sort((a,b) => (b.creado||'').localeCompare(a.creado||''));
    b.innerHTML = `<div class="tablero">${ESTADOS.map(([k,l,c]) => { const xs = ps.filter(p => p.estado===k);
      return `<section class="colp" style="--c:${c}"><h3><span>${l}</span><span>${xs.length}</span></h3>
        ${xs.length ? xs.map(tarjeta).join('') : '<p class="vacio">Sin pedidos</p>'}</section>`; }).join('')}</div>`;
  }
  if($('#mDet').classList.contains('on') && detId) pintarDet();
}
function tarjeta(p){
  const [h,t] = avance(p), c = estDe(p.estado)[2];
  return `<button class="ped" data-ped="${esc(p.id)}" style="--c:${c}">
    <span class="idp">${esc(p.id)} · ${esc(fechaL(p.creado).slice(0,5))}</span>
    <b>${esc(p.cliente||'Sin cliente')}</b>
    ${p.desc ? `<small>${esc(p.desc)}</small>` : ''}
    <div class="prog"><i style="width:${t ? h/t*100 : 0}%"></i></div>
    <small>${h}/${t} piezas${p.total ? ' · '+esc(p.total) : ''}</small>
  </button>`;
}

const ES_CARP = a => a.mimeType==='application/vnd.google-apps.folder';
function abrirDet(id){ detId = id; detArch = null; detRuta = []; editando = false; $('#mDet').classList.add('on'); pintarDet(); cargarArchDet(); }
async function cargarArchDet(){
  const p = PED.data.pedidos.find(x => x.id===detId);
  if(!p || !p.carpeta){ detArch = []; pintarDet(); return; }
  const dest = detRuta.length ? detRuta[detRuta.length-1].id : p.carpeta;
  try{ detArch = (await listarEn(dest)).sort((a,b) => (ES_CARP(b)-ES_CARP(a)) || a.name.localeCompare(b.name,'es',{numeric:true})); }catch(e){ if(!errSesion(e)) detArch = 'err'; }
  pintarDet();
}

  const mat = normMat(z.mat||''), num = z.num || (i!=null ? i+1 : 0);
  return `<div class="pzed"${num?` data-num="${num}"`:''}${z.ok?' data-ok="1"':''}${z.arch?` data-arch='${esc(JSON.stringify(z.arch))}'`:''}>
    <span class="nwrap"><i>${num ? String(num).padStart(2,'0') : '+'}</i><input data-k="n" value="${esc(z.n||'')}" placeholder="Pieza" aria-label="Pieza"></span>
    <input data-k="d" value="${esc(z.d||'')}" placeholder="Medida" aria-label="Medida" class="m2">
    <select data-k="mat" aria-label="Material">${optsMat(mat,'Material')}</select>
    <select data-k="e" aria-label="Espesor">${optsEsp(mat, z.e)}</select>
    <input data-k="q" type="number" min="1" step="1" inputmode="numeric" value="${Math.max(1,parseInt(z.q)||1)}" aria-label="Cantidad">

function leerEdicion(){
  const filas = [...document.querySelectorAll('#edPzs .pzed')].map(r => {
    const v = k => r.querySelector(`[data-k=${k}]`).value;
    const z = {n: v('n').trim(), d: v('d').trim(), mat: v('mat'), e: v('e')===''?'':+v('e'), q: Math.max(1, parseInt(v('q'))||1), ok: !!r.dataset.ok};
    if(r.dataset.num) z.num = +r.dataset.num;
    if(r.dataset.arch){ try{ z.arch = JSON.parse(r.dataset.arch); }catch(e){} }
    return z;
  }).filter(z => z.n || z.d);
  const p = PED.data.pedidos.find(x => x.id===detId);       // las piezas nuevas siguen la numeración (no se reutilizan números)
  let max = Math.max(0, ...(p?.piezas||[]).map((z,i) => z.num || i+1), ...filas.map(z => z.num||0));
  filas.forEach(z => { if(!z.num) z.num = ++max; });
  return filas;
}
async function guardarEdicion(){
  if(!esMaestro()) return;
  const id = detId, piezas = leerEdicion(), cli = $('#edCli').value.trim();
  if(!cli){ aviso('Falta el nombre del cliente', true); $('#edCli').focus(); return; }
  const cambios = {cliente:cli, correo:$('#edMail').value.trim(), desc:$('#edDesc').value.trim(), material:$('#edMat').value.trim(), total:$('#edTot').value.trim()};
  const generarOT = $('#edOT').checked;
  const tk = CARGA.inicio('Guardando cambios del pedido…', 3);
  try{
    let ped = null;
    await mutar(d => { const p = d.pedidos.find(x => x.id===id); if(!p) return;
      const antes = JSON.stringify([p.cliente,p.correo,p.desc,p.material,p.total,p.piezas]);
      Object.assign(p, cambios); p.piezas = piezas;
      if(antes !== JSON.stringify([p.cliente,p.correo,p.desc,p.material,p.total,p.piezas])) (p.hist=p.hist||[]).push({t:ahora(), q:yo(), a:'Pedido editado'});
      ped = JSON.parse(JSON.stringify(p)); });
    if(generarOT && ped && ped.carpeta){
      tk.texto('Generando orden de trabajo…').real(.5);
      const hijos = await listarEn(ped.carpeta);
      let inf = hijos.find(a => ES_CARP(a) && a.name === '01 Informes')?.id;
      if(!inf) inf = await crearCarpeta('01 Informes', ped.carpeta);
      const f = await ordenTrabajo(ped);
      const st = new Date(), dd = n => String(n).padStart(2,'0');
      await subirA(new File([f], f.name.replace(/\.pdf$/i, `_editada_${dd(st.getDate())}-${dd(st.getMonth()+1)}_${dd(st.getHours())}${dd(st.getMinutes())}.pdf`), {type:'application/pdf'}), inf);
    }
    editando = false; aviso('Pedido '+id+' actualizado'); pintarDet(true); cargarArchDet();
  }catch(err){ if(!errSesion(err)) aviso('No se pudo guardar: '+err.message, true); }
  finally{ tk.fin(); }
}
async function eliminarPedido(){
  if(!esMaestro()) return;
  const id = detId;
  if(!confirm(`¿Eliminar el pedido ${id}? Se quita de la lista (queda guardado en la papelera de pedidos). Su carpeta en Drive no se borra.`)) return;
  try{
    await mutar(d => { const i = d.pedidos.findIndex(x => x.id===id); if(i < 0) return;
      const [p] = d.pedidos.splice(i, 1); (p.hist=p.hist||[]).push({t:ahora(), q:yo(), a:'Eliminado'});
      (d.papelera = d.papelera || []).push(p); });
    editando = false; cerrarModal(); aviso('Pedido '+id+' eliminado');
  }catch(err){ if(!errSesion(err)) aviso('No se pudo eliminar: '+err.message, true); }
}
$('#detBody').addEventListener('click', e => {
  if(e.target.closest('[data-editar]')){ if(esMaestro()){ editando = true; pintarDet(true); } return; }
  if(e.target.closest('[data-cancelar-ed]')){ editando = false; pintarDet(true); return; }
  if(e.target.closest('[data-guardar-ed]')){ guardarEdicion(); return; }
  if(e.target.closest('[data-eliminar-ped]')){ eliminarPedido(); return; }
  if(e.target.closest('[data-agregar-ed]')){ $('#edPzs').insertAdjacentHTML('beforeend', filaEd({mat: $('#edMat')?.value||''})); $('#edPzs').lastElementChild.querySelector('input').focus(); return; }
  const qe = e.target.closest('[data-quitar-ed]'); if(qe){ qe.closest('.pzed').remove(); return; }
  const es = e.target.closest('[data-est]');
  if(es){ const k = es.dataset.est, id = detId;
    mutar(d => { const p = d.pedidos.find(x => x.id===id); if(p && p.estado!==k){ p.estado = k; (p.hist=p.hist||[]).push({t:ahora(), q:yo(), a:'Estado: '+estDe(k)[1]}); } })
      .catch(err => { if(!errSesion(err)) aviso('No se pudo guardar: '+err.message, true); });
    return; }
  const cp = e.target.closest('[data-carp]');
  if(cp){ detRuta.push({id:cp.dataset.carp, name:cp.dataset.nombre}); detArch = null; pintarDet(); cargarArchDet(); return; }
  const rt = e.target.closest('[data-ruta]');
  if(rt){ detRuta = detRuta.slice(0, +rt.dataset.ruta + 1); detArch = null; pintarDet(); cargarArchDet(); return; }
  if(e.target.closest('#detSubir')){ adjDestino = 'det'; $('#adjIn').click(); return; }
  const vr = e.target.closest('[data-ver]');
  if(vr){ e.preventDefault(); verPieza(+vr.dataset.ver); return; }
  const pc = e.target.closest('[data-pzclip]');
  if(pc){ e.preventDefault(); adjDestino = 'pieza:'+pc.dataset.pzclip; $('#adjIn').multiple = false; $('#adjIn').click(); return; }
  const bj = e.target.closest('[data-bajar-det]');
  if(bj){ e.preventDefault(); bajarArchivo(bj.dataset.bajarDet, bj.dataset.nombre); return; }
  if(e.target.closest('[data-copiar-mail]')){ const p = PED.data.pedidos.find(x => x.id===detId); copiar(p?.mail||''); }
});
$('#detBody').addEventListener('change', e => {
  if(e.target.matches('.pzed [data-k=mat]')){ const r = e.target.closest('.pzed'), es = r.querySelector('[data-k=e]'); es.innerHTML = optsEsp(e.target.value, es.value); return; }
  const i = e.target.dataset.tg; if(i==null) return;
  const v = e.target.checked, id = detId;
  e.target.closest('.pz').classList.toggle('ok', v);
  mutar(d => {
    const p = d.pedidos.find(x => x.id===id); if(!p || !p.piezas[i]) return;
    p.piezas[i].ok = v;
    (p.hist=p.hist||[]).push({t:ahora(), q:yo(), a:(v?'Cortada: ':'Desmarcada: ')+(p.piezas[i].n||'pieza')});
    const [h,t] = avance(p);
    if(t && h===t && p.estado!=='listo'){ p.estado='listo'; p.hist.push({t:ahora(), q:yo(), a:'Estado: Listo'}); }
    else if(h<t && (p.estado==='listo' || (h>0 && p.estado!=='corte'))){ p.estado='corte'; p.hist.push({t:ahora(), q:yo(), a:'Estado: En corte'}); }
  }).catch(err => { if(!errSesion(err)) aviso('No se pudo guardar: '+err.message, true); });
});
function adjuntarAPieza(pid, i, f){
  const p = PED.data.pedidos.find(x => x.id===pid); if(!p || !f) return;
  conSesion(async () => {
    try{
      let carpeta = p.carpeta;
      if(!carpeta){ carpeta = await crearCarpeta(p.id); }
      aviso('Subiendo '+f.name+'…');
      const r = await subirA(f, carpeta);
      await mutar(d => { const q = d.pedidos.find(x => x.id===pid); if(!q || !q.piezas[i]) return; q.carpeta = carpeta; q.piezas[i].arch = {id:r.id, name:f.name};

      if(c.paquete && r.piezas.length) r.paq = c.paquete;
      { const ms = [...new Set(r.piezas.map(z => z.mat).filter(Boolean))]; if(ms.length===1) r.material = ms[0]; else if(ms.length>1) r.material = 'Varios'; }
      const ts = d.querySelectorAll('.qt-kv.total b'); if(ts.length) r.total = ts[ts.length-1].textContent.trim();
      { const n = r.piezas.reduce((a,z)=>a+(+z.q||1),0); r.desc = [n ? `Corte láser · ${n} pieza${n===1?'':'s'}` : '', inf.numero ? 'Cot. N° '+inf.numero : '', inf.entrega ? 'Entrega '+inf.entrega : ''].filter(Boolean).join(' · '); }
      if(inf.total) r.total = inf.total;

function rellenarCliente(){
  const prev = pedidosPrevios($('#pCli').value)[0]; if(!prev) return;
  $('#pCli').value = prev.cliente.trim();
  if(!$('#pMail').value.trim() && prev.correo) $('#pMail').value = prev.correo;
  if(!$('#pMat').value && prev.material){ $('#pMat').innerHTML = optsMat(prev.material==='Varios'?'':prev.material,'Elegir…')+`<option${prev.material==='Varios'?' selected':''}>Varios</option>`; }
}
function pintarClientes(){
  const xs = [...new Map(PED.data.pedidos.slice().sort((a,b) => (b.creado||'').localeCompare(a.creado||'')).filter(p => p.cliente).map(p => [p.cliente.trim().toLowerCase(), p.cliente.trim()])).values()];
  $('#dlCli').innerHTML = xs.map(c => `<option value="${esc(c)}">`).join('');
}
$('#pCli').addEventListener('change', () => { rellenarCliente(); generarMail(); });

async function abrirPublicar(origen, adjuntar){
  pubOrigen = origen; mailEditado = false; pubAntes = null;
  // Ensambles: si hay un modelo cargado pero aún no se detectaron las chapas, se detectan antes de publicar
  if(origen==='ensambles'){ const w = abiertas.get(origen)?.frame.contentWindow;
    try{ if(w && typeof w.analyzeSheets==='function' && !(w.__xyzPub && w.__xyzPub())){ await CARGA.con('Detectando chapas del ensamble…', () => w.analyzeSheets(), 3); } }catch(e){} }
  const x = extraer(origen);
  if(origen!=='manual' && !x.piezas.length) aviso((ORIGEN[origen]||'La herramienta')+' no tiene piezas listas: se abre como pedido para completar a mano', true);
  $('#mPubT').textContent = origen==='manual' ? 'NUEVO PEDIDO' : 'PUBLICAR PEDIDO · '+(ORIGEN[origen]||'');
  pzArch.clear(); $('#pCli').value = x.cliente||''; $('#pMail').value = ''; $('#pDesc').value = x.desc||''; $('#pMat').innerHTML = optsMat(x.material==='Varios'?'':normMat(x.material||''),'Elegir…')+`<option${x.material==='Varios'?' selected':''}>Varios</option>`; $('#pTot').value = x.total||'';
  if(!x.material && !x.piezas.some(z => z.mat) && LS.get('hub-ult-mat')){ const um = LS.get('hub-ult-mat'); $('#pMat').innerHTML = optsMat(um==='Varios'?'':um,'Elegir…')+`<option${um==='Varios'?' selected':''}>Varios</option>`; }
  $('#pPzs').innerHTML = (x.piezas.length ? x.piezas : [{}]).map(filaPz).join('');
  pzCorta = true; $('#pSelTodas').checked = false; $('#lMat').value = ''; prepLote(); pintarClientes(); rellenarCliente(); pintarLote();
  pubAdj = x.adj; pubFicha = x.ficha||[]; pubPaq = x.paq||null; pubAuto = {origen, paq:!!x.paq}; pintarAdj(); generarMail();
  $('#pPublicar').disabled = false; $('#pPublicar').textContent = 'Publicar';
  $('#pDestRow').hidden = origen==='manual';
  const ult = adjuntar ? (PED.data?.pedidos||[]).slice().reverse().find(p => p.estado!=='entregado') || (PED.data?.pedidos||[]).slice(-1)[0] : null;
  opcionesDestino(ult ? ult.id : ''); aplicarDestino();
  $('#mPub').classList.add('on'); setTimeout(() => (adjuntar ? $('#pDest') : $('#pCli')).focus(), 50);
}
$('#mPub').addEventListener('input', e => {
  if(e.target.id==='pCuerpo'){ mailEditado = true; return; }
  if(e.target.closest('#pPzBar')) return;
  if(e.target.dataset.k==='q') pintarLote();
  generarMail();
});
$('#mPub').addEventListener('click', e => {
  const q = e.target.closest('[data-quitar]'); if(q){ q.closest('.pzr').remove(); if(!$('#pPzs').children.length) $('#pPzs').insertAdjacentHTML('beforeend', filaPz()); pintarLote(); generarMail(); return; }
  const qa = e.target.closest('[data-quitar-adj]'); if(qa){ pubAdj.splice(+qa.dataset.quitarAdj,1); pintarAdj(); return; }
  const qd = e.target.closest('[data-qd]'); if(qd){ const inp = qd.parentNode.querySelector('input'); inp.value = Math.max(1, (parseInt(inp.value)||1) + (+qd.dataset.qd)); pintarLote(); generarMail(); return; }
  const cl = e.target.closest('[data-clip]'); if(cl){ adjDestino = 'fila:'+cl.closest('.pzr').dataset.rid; $('#adjIn').multiple = false; $('#adjIn').click(); return; }
  const qc = e.target.closest('[data-quitar-clip]'); if(qc){ const row = qc.closest('.pzr'); pzArch.delete(row.dataset.rid); pintarFila(row); return; }
});
$('#mPub').addEventListener('change', e => {
  const s = e.target;
  if(s.matches('[data-sel]')){ pintarLote(); return; }
  if(s.closest('#pPzBar')) return;
  if(s.dataset.k==='q'){ s.value = Math.max(1, parseInt(s.value)||1); }
  if(s.dataset.k==='mat'){ const es = s.closest('.pzr').querySelector('[data-k=e]'); es.innerHTML = optsEsp(s.value, es.value); }
  if(s.dataset.k==='mat' || s.dataset.k==='e') pintarAdj();
  if(s.id==='pMat' && s.value && s.value!=='Varios'){
    // el material del pedido se copia a las piezas que no tienen uno elegido
    document.querySelectorAll('#pPzs .pzr').forEach(r => { const m = r.querySelector('[data-k=mat]'); if(!m.value){ m.innerHTML = optsMat(s.value,'Material'); const es = r.querySelector('[data-k=e]'); es.innerHTML = optsEsp(s.value, es.value); } });
  }
  generarMail();
});
$('#pAddPz').onclick = () => { $('#pPzs').insertAdjacentHTML('beforeend', filaPz()); $('#pPzs').lastElementChild.querySelector('[data-k=n]').focus(); pintarLote(); };
$('#pAddArch').onclick = () => { adjDestino = 'pub'; $('#adjIn').click(); };
$('#pCopiar').onclick = () => copiar($('#pCuerpo').value);
$('#adjIn').onchange = async e => {
  const fs = [...e.target.files]; e.target.value = ''; $('#adjIn').multiple = true;
  if(!fs.length) return;
  if(adjDestino==='pub'){ pubAdj.push(...fs); pintarAdj(); return; }
  if(adjDestino.startsWith('fila:')){ const rid = adjDestino.slice(5), row = document.querySelector(`#pPzs .pzr[data-rid="${rid}"]`); if(row){ pzArch.set(rid, fs[0]); pintarFila(row); } return; }
  if(adjDestino.startsWith('pieza:')){ adjuntarAPieza(detId, +adjDestino.slice(6), fs[0]); return; }
  const p = PED.data.pedidos.find(x => x.id===detId); if(!p) return;
  conSesion(async () => {
    try{
      let carpeta = p.carpeta;
      if(!carpeta){ carpeta = await crearCarpeta(p.id); await mutar(d => { const q = d.pedidos.find(x => x.id===p.id); if(q) q.carpeta = carpeta; }); }
      const dest = detRuta.length ? detRuta[detRuta.length-1].id : carpeta;
      for(const f of fs){ aviso('Subiendo '+f.name+'…'); await subirA(f, dest); }
      aviso(fs.length===1 ? 'Archivo subido' : fs.length+' archivos subidos'); cargarArchDet();
    }catch(err){ if(!errSesion(err)) aviso('No se pudo subir: '+err.message, true); }
  });
};
$('#pPublicar').onclick = () => conSesion(async () => {
  const piezas = leerPzs(), cli = $('#pCli').value.trim();
  if(!cli){ aviso('Falta el nombre del cliente', true); $('#pCli').focus(); return; }
  const btn = $('#pPublicar'), dest = $('#pDest').value; btn.disabled = true; btn.textContent = dest ? 'Agregando…' : 'Publicando…';
  const tk = CARGA.inicio(dest ? 'Agregando piezas a '+dest+'…' : 'Publicando pedido…', 3);
  if(dest){ try{ await adjuntarPedido(dest, piezas, btn, tk); }
    catch(err){ tk.fin(); btn.disabled = false; btn.textContent = 'Agregar al pedido'; if(!errSesion(err)) aviso('No se pudo agregar: '+err.message, true); }
    return; }
  try{
    const archPz = piezas.map(z => z._file), srcPz = piezas.map(z => z._src); piezas.forEach((z,i) => { delete z._file; delete z._src; z.num = i+1; });
    const base = {origen:pubOrigen, cliente:cli, correo:$('#pMail').value.trim(), desc:$('#pDesc').value.trim(), material:$('#pMat').value.trim(),
      total:$('#pTot').value.trim(), estado:'cotizado', piezas, ficha:pubFicha, mail:$('#pCuerpo').value, creado:ahora(), por:yo(), carpeta:null};
    if(base.material) LS.set('hub-ult-mat', base.material);
    const pref = PREFIJO[pubOrigen] || 'PED';
    const id = await mutar(d => {
      d.seq[pref] = (d.seq[pref]||0) + 1;
      const id = `${pref}-${String(d.seq[pref]).padStart(4,'0')}`;
      d.pedidos.push({id, ...base, hist:[{t:ahora(), q:yo(), a:'Publicado'}]});
      return id;
    });
    let paq = null;
    try{ const w = abiertas.get(pubOrigen)?.frame.contentWindow;   // la herramienta necesita la librería de PDF para sus informes
      if(w && pubPaq && !(w.jspdf && w.jspdf.jsPDF)){ tk.texto('Preparando informes…'); await cargarJsPDF(); w.jspdf = window.jspdf; } }catch(e){}
    if(pubPaq){
      try{ paq = await pubPaq(m => { btn.textContent = m+'…'; tk.texto(m+'…'); }); }
      catch(e){ aviso('No se pudo armar el paquete de la herramienta: '+e.message, true); }
    }
    btn.textContent = 'Creando carpetas…'; tk.texto('Creando carpetas…').real(.05);
    const carpeta = await crearCarpeta(id), subidos = [], avisos = [...(paq?.avisos||[])];
    let hechos = 0;
    const total = pubAdj.length + archPz.filter(Boolean).length + (paq ? paq.informes.length + paq.planchas.length + paq.piezas.length + (paq.extras||[]).length : 0) + 1;
    const subir = async (f, dest) => { btn.textContent = `Subiendo ${++hechos}/${total} · ${f.name}`; tk.texto(`Subiendo ${hechos}/${total} · ${f.name}`).real(.05 + .9*(hechos-1)/total);
      const r = await subirA(f, dest); tk.real(.05 + .9*hechos/total); return r; };
    for(const f of pubAdj) await subir(f, carpeta);
    for(let i=0;i<archPz.length;i++){ const f = archPz[i]; if(!f) continue; const r = await subir(f, carpeta); subidos.push([i, {id:r.id, name:f.name}]); }
    let nPzDxf = 0;
    if(paq){
      if(paq.planchas.length){ const c = await crearCarpeta('02 DXF planchas', carpeta); for(const f of paq.planchas) await subir(f, c); }
      const pzs = paq.piezas.map(z => ({...z, fila: srcPz.indexOf(z.idx)})).filter(z => z.fila>=0);
      if(pzs.length){
        const raiz = await crearCarpeta('03 DXF piezas', carpeta), sub = {};
        for(const z of pzs){
          const row = piezas[z.fila], cn = carpetaDe(row);
          if(!sub[cn]) sub[cn] = await crearCarpeta(cn, raiz);
          const f = new File([z.file], nombrePz(z.fila, row, z.file), {type:z.file.type});
          const r = await subir(f, sub[cn]); nPzDxf++;
          if(!archPz[z.fila]) subidos.push([z.fila, {id:r.id, name:f.name, carpeta:cn}]);
          for(const x of (paq.extras||[]).filter(x => x.idx===z.idx)) await subir(new File([x.file], String(z.fila+1).padStart(2,'0')+'_'+x.file.name, {type:x.file.type}), sub[cn]);
        }
      }
    }
    // orden de trabajo con los archivos ya enlazados
    const inf = await crearCarpeta('01 Informes', carpeta);
    try{
      btn.textContent = 'Orden de trabajo…';
      const ped = {id, ...base, piezas: piezas.map((z,i) => { const a = subidos.find(x => x[0]===i); return a ? {...z, arch:a[1]} : z; })};
      await subir(await ordenTrabajo(ped), inf);
    }catch(e){ avisos.push('No se generó la orden de trabajo: '+e.message); }
    if(paq) for(const f of paq.informes) await subir(f, inf);
    const nInf = 1 + (paq ? paq.informes.length : 0);
    await mutar(d => { const q = d.pedidos.find(x => x.id===id); if(!q) return; q.carpeta = carpeta; subidos.forEach(([i,a]) => { if(q.piezas[i]) q.piezas[i].arch = a; });
      (q.hist=q.hist||[]).push({t:ahora(), q:yo(), a:`Carpeta C.I.D.: ${nInf} informe${nInf===1?'':'s'}${paq && paq.planchas.length ? ', '+paq.planchas.length+' DXF de planchas' : ''}${nPzDxf ? ', '+nPzDxf+' DXF de piezas' : ''}`}); });
    if(avisos.length){ console.warn('Publicación:', avisos); aviso(avisos[0], true); }
    tk.fin(); cerrarModal(); aviso(`Pedido ${id} publicado`); mostrar('pedidos'); abrirDet(id);
  }catch(err){
    tk.fin();
    btn.disabled = false; btn.textContent = 'Publicar';
    if(!errSesion(err)) aviso('No se pudo publicar: '+err.message, true);
  }
});

/* ---------- destino: pedido nuevo o uno existente ---------- */
function opcionesDestino(sel){
  const ps = (PED.data?.pedidos||[]).slice().reverse();
  $('#pDest').innerHTML = `<option value="">Pedido nuevo</option>` + ps.map(p => `<option value="${esc(p.id)}"${p.id===sel?' selected':''}>Agregar a ${esc(p.id)} · ${esc(p.cliente||'sin cliente')} · ${esc(estDe(p.estado)[1])}</option>`).join('');
}
let pubAntes = null;   // lo que traía la herramienta, para volver a «Pedido nuevo»
function aplicarDestino(){
  const id = $('#pDest').value, p = id ? PED.data.pedidos.find(x => x.id===id) : null;
  $('#mPubT').textContent = p ? 'ADJUNTAR A PEDIDO · '+(ORIGEN[pubOrigen]||'') : pubOrigen==='manual' ? 'NUEVO PEDIDO' : 'NUEVO PEDIDO · '+(ORIGEN[pubOrigen]||'');
  if(p){ if(!pubAntes) pubAntes = {cli:$('#pCli').value, mail:$('#pMail').value, desc:$('#pDesc').value, tot:$('#pTot').value};
    $('#pCli').value = p.cliente||''; $('#pMail').value = p.correo||''; $('#pDesc').value = p.desc||''; $('#pTot').value = p.total||''; }
  else if(pubAntes){ $('#pCli').value = pubAntes.cli; $('#pMail').value = pubAntes.mail; $('#pDesc').value = pubAntes.desc; $('#pTot').value = pubAntes.tot; pubAntes = null; }
  ['#pCli','#pMail','#pDesc','#pTot'].forEach(q => $(q).disabled = !!p);
  $('#mPub').classList.toggle('adjuntar', !!p);
  $('#pPublicar').textContent = p ? 'Agregar al pedido' : 'Publicar';
  if(!p) generarMail();
}
$('#pDest').addEventListener('change', aplicarDestino);
async function subcarpeta(nombre, padre){
  const h = await listarEn(padre); const c = h.find(a => ES_CARP(a) && a.name===nombre);
  return c ? c.id : crearCarpeta(nombre, padre);
}
// agrega las piezas (y sus archivos) a un pedido existente, con la numeración siguiente y orden de trabajo actualizada
async function adjuntarPedido(pid, piezas, btn, tk){
  const p0 = PED.data.pedidos.find(x => x.id===pid); if(!p0) throw new Error('el pedido ya no existe');
  const archPz = piezas.map(z => z._file), srcPz = piezas.map(z => z._src);
  const base0 = Math.max(0, ...(p0.piezas||[]).map((z,i) => z.num || i+1));
  piezas.forEach((z,i) => { delete z._file; delete z._src; z.num = base0 + i + 1; });
  let paq = null;
  try{ const w = abiertas.get(pubOrigen)?.frame.contentWindow;
    if(w && pubPaq && !(w.jspdf && w.jspdf.jsPDF)){ tk.texto('Preparando informes…'); await cargarJsPDF(); w.jspdf = window.jspdf; } }catch(e){}
  if(pubPaq){ try{ paq = await pubPaq(m => { btn.textContent = m+'…'; tk.texto(m+'…'); }); }catch(e){ aviso('No se pudo armar el paquete de la herramienta: '+e.message, true); } }
  btn.textContent = 'Abriendo carpeta…'; tk.texto('Abriendo carpeta del pedido…').real(.05);
  let carpeta = p0.carpeta; if(!carpeta) carpeta = await crearCarpeta(pid);
  const subidos = [], avisos = [...(paq?.avisos||[])]; let hechos = 0;
  const total = pubAdj.length + archPz.filter(Boolean).length + (paq ? paq.informes.length + paq.planchas.length + paq.piezas.length + (paq.extras||[]).length : 0) + 1;
  const subir = async (f, dest) => { btn.textContent = `Subiendo ${++hechos}/${total} · ${f.name}`; tk.texto(`Subiendo ${hechos}/${total} · ${f.name}`).real(.05 + .9*(hechos-1)/total);
    const r = await subirA(f, dest); tk.real(.05 + .9*hechos/total); return r; };
  for(const f of pubAdj) await subir(f, carpeta);
  for(let i=0;i<archPz.length;i++){ const f = archPz[i]; if(!f) continue; const r = await subir(f, carpeta); subidos.push([i, {id:r.id, name:f.name}]); }
  let nPzDxf = 0;
  if(paq){
    if(paq.planchas.length){ const c = await subcarpeta('02 DXF planchas', carpeta); for(const f of paq.planchas) await subir(f, c); }
    const pzs = paq.piezas.map(z => ({...z, fila: srcPz.indexOf(z.idx)})).filter(z => z.fila>=0);
    if(pzs.length){
      const raiz = await subcarpeta('03 DXF piezas', carpeta), sub = {};
      for(const z of pzs){
        const row = piezas[z.fila], cn = carpetaDe(row);
        if(!sub[cn]) sub[cn] = await subcarpeta(cn, raiz);
        const f = new File([z.file], nombrePz(row.num-1, row, z.file), {type:z.file.type});
        const r = await subir(f, sub[cn]); nPzDxf++;
        if(!archPz[z.fila]) subidos.push([z.fila, {id:r.id, name:f.name, carpeta:cn}]);
        for(const x of (paq.extras||[]).filter(x => x.idx===z.idx)) await subir(new File([x.file], String(row.num).padStart(2,'0')+'_'+x.file.name, {type:x.file.type}), sub[cn]);
      }
    }
  }
  const nuevas = piezas.map((z,i) => { const a = subidos.find(x => x[0]===i); return a ? {...z, arch:a[1]} : z; });
  let ped = null;
  await mutar(d => { const q = d.pedidos.find(x => x.id===pid); if(!q) return; q.carpeta = carpeta;
    q.piezas = (q.piezas||[]).map((z,i) => z.num ? z : {...z, num:i+1}).concat(nuevas);
    const ms = [...new Set(q.piezas.map(z => z.mat).filter(Boolean))]; if(ms.length > 1) q.material = 'Varios'; else if(ms.length===1 && !q.material) q.material = ms[0];
    if(q.estado==='listo') q.estado = 'corte';
    (q.hist=q.hist||[]).push({t:ahora(), q:yo(), a:`Agregada${nuevas.length===1?'':'s'} ${nuevas.length} pieza${nuevas.length===1?'':'s'} desde ${ORIGEN[pubOrigen]||pubOrigen}${nPzDxf ? ' ('+nPzDxf+' DXF)' : ''}`});
    ped = JSON.parse(JSON.stringify(q)); });
  const inf = await subcarpeta('01 Informes', carpeta);
  try{ btn.textContent = 'Orden de trabajo…';
    const f = await ordenTrabajo(ped), st = new Date(), dd = n => String(n).padStart(2,'0');
    await subir(new File([f], f.name.replace(/\.pdf$/i, `_actualizada_${dd(st.getDate())}-${dd(st.getMonth()+1)}_${dd(st.getHours())}${dd(st.getMinutes())}.pdf`), {type:'application/pdf'}), inf);
  }catch(e){ avisos.push('No se generó la orden de trabajo: '+e.message); }
  if(paq) for(const f of paq.informes) await subir(f, inf);
  if(avisos.length){ console.warn('Adjuntar:', avisos); aviso(avisos[0], true); }
  tk.fin(); cerrarModal(); aviso(`${nuevas.length} pieza${nuevas.length===1?'':'s'} agregada${nuevas.length===1?'':'s'} a ${pid}`); mostrar('pedidos'); abrirDet(pid);
}
$('#btnAdjuntar').onclick = () => conSesion(async () => {
  if(!PED.cargado) await cargarPedidos();
  if(!(PED.data?.pedidos||[]).length){ aviso('Todavía no hay pedidos: se abre como pedido nuevo', true); abrirPublicar(activa); return; }
  abrirPublicar(activa, true);
});

/* ================= SESIÓN GUARDADA Y TRABAJOS ================= */
// la sesión de Google queda guardada en este equipo (hasta que vence el permiso, ~1 h) y se renueva sola al tocar la app;
// los trabajos abiertos se guardan solos en este equipo y en la C.I.D. (Sesiones/<correo>.json) y se reabren al entrar
const SES_KEY = 'cid-sesion';
function sesGuardar(){ try{ localStorage.setItem(SES_KEY, JSON.stringify({token, vence:tokenVence, usuario})); }catch(e){} }
function sesLeer(){ try{ return JSON.parse(localStorage.getItem(SES_KEY)||'null'); }catch(e){ return null; } }
let recordado = null;   // usuario de la última sesión (aunque el permiso haya vencido)
(function(){ const s = sesLeer(); if(!s || !s.usuario) return; recordado = s.usuario;
  if(s.token && s.vence > Date.now() + 30000){ token = s.token; tokenVence = s.vence; usuario = s.usuario; $('#dotDrive').classList.add('on'); }
})();
// renovación sin pedir nada: aprovecha el próximo toque en la app (el navegador solo deja abrir la ventana de Google con un gesto)
let ultRenov = 0;
document.addEventListener('pointerdown', () => {
  if(!recordado || !iniciarCliente()) return;
  if(token && tokenVence - Date.now() > 5*60000) return;
  if(Date.now() - ultRenov < 90000) return; ultRenov = Date.now();
  cliente.requestAccessToken({prompt:'', login_hint: recordado.email || ''});
}, true);

const TRAB = {db:null, ultimo:'', sucio:false, tSubir:0, carpeta:null, archivo:null, ensSig:'', restaurando:false, listo:false, t:0};
function idb(){ return TRAB.db || (TRAB.db = new Promise((ok, mal) => { try{ const r = indexedDB.open('cid-trabajos', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('k'); r.onsuccess = () => ok(r.result); r.onerror = () => mal(r.error); }catch(e){ mal(e); } })); }
async function idbPut(k, v){ const db = await idb(); return new Promise((ok, mal) => { const tx = db.transaction('k','readwrite'); tx.objectStore('k').put(v, k); tx.oncomplete = ok; tx.onerror = () => mal(tx.error); }); }
async function idbGet(k){ const db = await idb(); return new Promise((ok, mal) => { const q = db.transaction('k').objectStore('k').get(k); q.onsuccess = () => ok(q.result); q.onerror = () => mal(q.error); }); }
const quien = () => (usuario?.email || recordado?.email || '').toLowerCase();
// foto de lo abierto ahora
function fotoTrabajos(){
  const tools = {}; let ens = null;
  abiertas.forEach((v, id) => { const w = v.frame.contentWindow; if(!w) return;
    try{ if(id==='ensambles'){ if(w.__ultimoArchivo) ens = w.__ultimoArchivo; return; }
      const e = w.__cidEstado; if(e && e.sacar){ const x = e.sacar(); if(x) tools[id] = x; } }catch(err){ console.warn('estado', id, err); } });
  return {v:1, por:quien(), abiertas:[...abiertas.keys()], activa, tools, ens: ens ? {name:ens.name, type:ens.type||'', size:ens.size, mod:ens.lastModified||0} : null, _ens: ens};
}
async function guardarTrabajos(forzar){
  if(TRAB.restaurando || !TRAB.listo) return;
  let f; try{ f = fotoTrabajos(); }catch(e){ return; }
  const blob = f._ens; delete f._ens;
  if(!f.abiertas.length && !TRAB.hubo) return;   // nada abierto todavía: no pisa lo guardado
  if(f.abiertas.length) TRAB.hubo = true;
  const firma = JSON.stringify([f.abiertas, f.activa, f.tools, f.ens]);
  if(firma === TRAB.ultimo && !forzar) return;
  TRAB.ultimo = firma; f.t = Date.now(); TRAB.t = f.t;
  try{ await idbPut('trabajos', f); if(blob) await idbPut('ensamble', blob); else if(!f.ens) await idbPut('ensamble', null); }catch(e){}
  TRAB.sucio = true; programarSubida();
}
function programarSubida(ms){ clearTimeout(TRAB.tSubir); TRAB.tSubir = setTimeout(subirTrabajos, ms ?? 20000); }
async function carpetaSesiones(){
  if(TRAB.carpeta) return TRAB.carpeta;
  const h = await listarEn(CFG.carpeta); const c = h.find(a => ES_CARP(a) && a.name==='Sesiones');
  return TRAB.carpeta = c ? c.id : await crearCarpeta('Sesiones', CFG.carpeta);
}
async function archivoEn(carp, nombre){ const h = await listarEn(carp); return h.find(a => a.name===nombre && !ES_CARP(a)) || null; }
async function subirTrabajos(){
  if(!TRAB.sucio || !sesionOk() || !quien()) return;
  TRAB.sucio = false;
  try{
    const f = await idbGet('trabajos'); if(!f) return;
    const carp = await carpetaSesiones(), nom = quien()+'.json';
    // el modelo de Ensambles va como archivo aparte (solo cuando cambia)
    if(f.ens){ const sig = [f.ens.name, f.ens.size, f.ens.mod].join('|');
      if(sig !== TRAB.ensSig){ const b = await idbGet('ensamble');
        if(b && b.size < 40e6){ const nb = quien()+'__ensamble';
          const ya = await archivoEn(carp, nb);
          if(ya) await api(`https://www.googleapis.com/upload/drive/v3/files/${ya.id}?uploadType=media&supportsAllDrives=true`, {method:'PATCH', body:b});
          else await subirA(new File([b], nb, {type:'application/octet-stream'}), carp);
          TRAB.ensSig = sig; } } }
    const cuerpo = new Blob([JSON.stringify(f)], {type:'application/json'});
    if(!TRAB.archivo) TRAB.archivo = (await archivoEn(carp, nom))?.id || null;
    if(TRAB.archivo) await api(`https://www.googleapis.com/upload/drive/v3/files/${TRAB.archivo}?uploadType=media&supportsAllDrives=true`, {method:'PATCH', headers:{'Content-Type':'application/json'}, body:cuerpo});
    else TRAB.archivo = (await subirA(new File([cuerpo], nom, {type:'application/json'}), carp)).id;
  }catch(e){ TRAB.sucio = true; if(e.message!=='sesion') console.warn('No se pudo guardar el trabajo en la C.I.D.', e); }
}
async function bajarTrabajosDrive(){
  if(!sesionOk() || !quien()) return null;
  try{ const carp = await carpetaSesiones(), a = await archivoEn(carp, quien()+'.json'); if(!a) return null; TRAB.archivo = a.id;
    const f = await (await api(`${API}/files/${a.id}?alt=media&supportsAllDrives=true`)).json();
    if(f && f.ens){ const b = await archivoEn(carp, quien()+'__ensamble');
      if(b){ const blob = await (await api(`${API}/files/${b.id}?alt=media&supportsAllDrives=true`)).blob(); f._ens = blob; TRAB.ensSig = [f.ens.name, f.ens.size, f.ens.mod].join('|'); } }
    return f; }catch(e){ console.warn('No se pudo leer el trabajo guardado en la C.I.D.', e); return null; }
}
// reabre las herramientas y les devuelve su trabajo
async function reabrir(f, origen){
  if(!f || !Array.isArray(f.abiertas) || !f.abiertas.length) return false;
  TRAB.restaurando = true;
  const tk = CARGA.inicio('Abriendo tus trabajos…', 2);
  try{
    const ids = f.abiertas.filter(id => TOOLS.some(t => t.id===id));
    for(let k=0; k<ids.length; k++){ const id = ids[k]; tk.texto('Abriendo tus trabajos · '+(TOOLS.find(t => t.id===id)?.name||id)+'…').real(k/ids.length);
      try{
        if(id==='ensambles'){ const b = f._ens; if(b && f.ens) await abrirEnsamble(new File([b], f.ens.name, {type:f.ens.type||'', lastModified:f.ens.mod||Date.now()})); continue; }
        const fr = await abrir(id); const w = fr && fr.contentWindow, x = f.tools && f.tools[id];
        if(w && x){ for(let i=0; i<150 && !(w.__cidEstado && w.__cidEstado.poner); i++) await new Promise(r => setTimeout(r, 100));
          if(w.__cidEstado && w.__cidEstado.poner) await w.__cidEstado.poner(x); }
      }catch(e){ console.warn('No se pudo reabrir', id, e); } }
    if(f.activa && abiertas.has(f.activa)) mostrar(f.activa);
    aviso(ids.length===1 ? 'Se abrió tu trabajo'+(origen?' '+origen:'') : `Se abrieron tus ${ids.length} trabajos`+(origen?' '+origen:''));
  }finally{ tk.fin(); TRAB.restaurando = false; TRAB.t = f.t||Date.now(); TRAB.ultimo = ''; TRAB.hubo = true; }
  return true;
}
async function iniciarTrabajos(){
  let local = null; try{ local = await idbGet('trabajos'); if(local && local.ens) local._ens = await idbGet('ensamble'); }catch(e){}
  if(local && local.por && quien() && local.por !== quien()) local = null;   // era de otra cuenta
  const hash = location.hash.slice(1);
  if(!abiertas.size && hash!=='pedidos'){
    let f = local;
    if(sesionOk()){ const d = await Promise.race([bajarTrabajosDrive(), new Promise(r => setTimeout(() => r(null), 6000))]); if(d && (!f || (d.t||0) > (f.t||0))) f = d; }
    if(f) await reabrir(f);
  }
  TRAB.listo = true; TRAB.ultimo = '';
  setInterval(() => { if(document.visibilityState==='visible') guardarTrabajos(); }, 5000);
}
// al iniciar sesión en otro equipo: si en la C.I.D. hay trabajo más nuevo y aquí no se ha tocado nada, se abre
async function trabajosAlEntrar(){
  if(!TRAB.listo) return;
  const d = await bajarTrabajosDrive();
  if(d && d.abiertas && d.abiertas.length && !abiertas.size){ await reabrir(d, 'desde la C.I.D.'); return; }
  if(d && (d.t||0) > (TRAB.t||0) && abiertas.size) aviso('Hay trabajo más nuevo guardado en la C.I.D.: cierra las herramientas y vuelve a entrar para abrirlo', true);
  else if(TRAB.sucio) programarSubida(1000);
}
document.addEventListener('visibilitychange', () => { if(document.visibilityState==='hidden'){ guardarTrabajos(); programarSubida(0); } });
window.addEventListener('pagehide', () => { guardarTrabajos(); });
