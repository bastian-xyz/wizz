(function(){const L=HUB_LOG,b=$('#hubVer');b.textContent='HUB '+L[0].v;
  const lg=a=>a.map(e=>`<div class="hlg"><b>v${e.v}</b><time>${e.t}</time><ul>${e.c.map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('');
  $('#hlogList').innerHTML=lg(L)+'<h4>VERSIÓN DE CADA HERRAMIENTA</h4>'+TOOLS.map(t=>`<div class="hlg"><b>${esc(t.name)}</b><time>${t.ver?'v'+esc(t.ver):'sin versión registrada'}</time></div>`).join('');
  b.onclick=()=>$('#hlogBg').classList.add('on');$('#hlogX').onclick=()=>$('#hlogBg').classList.remove('on');$('#hlogBg').onclick=e=>{if(e.target.id==='hlogBg')$('#hlogBg').classList.remove('on');};})();

/* ================= ARRANQUE ================= */
pintarInicio(); pintarResumen();
/* ================= APP INSTALABLE ================= */
let pedidoInstalar = null;
/* En el navegador el botón instala la app; dentro de la app instalada se convierte en «Actualizar». */
const enApp = () => matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: minimal-ui)').matches || navigator.standalone === true;
const ICO_ACT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg><span class="cnt"></span>';
const vNum = v => String(v||'').split('.').map(n => +n || 0);
const masNueva = (a, b) => { const x = vNum(a), y = vNum(b); for(let i=0;i<3;i++){ if((x[i]||0) !== (y[i]||0)) return (x[i]||0) > (y[i]||0); } return false; };
let vRemota = null;
async function versionPublicada(){
  try{ const r = await fetch('version.txt?' + Date.now(), {cache:'no-store'}); if(r.ok){ const v = (await r.text()).trim(); if(/^\d+\.\d+\.\d+$/.test(v)) return v; } }catch(e){}
  try{ const r = await fetch('index.html?' + Date.now(), {cache:'no-store'}); const m = (await r.text()).match(/const HUB_LOG=\[\s*\{v:'([\d.]+)'/); if(m) return m[1]; }catch(e){}
  return null;
}
function pintarActualizar(){
  const b = $('#btnInstalar'), hay = vRemota && masNueva(vRemota, HUB_LOG[0].v);
  b.classList.toggle('nueva', !!hay); b.querySelector('.cnt').textContent = hay ? '1' : '';
  b.title = hay ? `Hay una versión nueva (${vRemota}) · toca para actualizar` : `Actualizar · tienes la ${HUB_LOG[0].v}`;
}
async function revisarVersion(silencio){
  const v = await versionPublicada(); if(v) vRemota = v; pintarActualizar();
  if(!silencio){ if(!v) aviso('No se pudo revisar si hay versión nueva · revisa la conexión', true);
    else if(!masNueva(v, HUB_LOG[0].v)) aviso(`Ya tienes la última versión (${HUB_LOG[0].v})`); }
  return v && masNueva(v, HUB_LOG[0].v) ? v : null;
}
async function actualizarApp(){
  const b = $('#btnInstalar'); b.classList.add('gira');
  const tk = CARGA.inicio('Buscando actualización…', 3);
  try{
    const nueva = await revisarVersion(true);
    if(!nueva){ aviso(vRemota ? `Ya tienes la última versión (${HUB_LOG[0].v})` : 'No se pudo revisar si hay versión nueva · revisa la conexión', !vRemota); return; }
    if(abiertas.size && !confirm(`Hay una versión nueva (${nueva}). Se cerrarán las herramientas abiertas; guarda tu trabajo antes. ¿Actualizar ahora?`)) return;
    tk.texto(`Actualizando a ${nueva}…`).real(.4);
    try{ const reg = await navigator.serviceWorker?.getRegistration(); if(reg) await reg.update(); }catch(e){}
    try{ for(const k of await caches.keys()) await caches.delete(k); }catch(e){}
    tk.real(.9); abiertas.clear(); location.reload();
  }finally{ tk.fin(); setTimeout(() => b.classList.remove('gira'), 600); }
}
if(enApp()){
  const b = $('#btnInstalar'); b.hidden = false; b.classList.add('act'); b.innerHTML = ICO_ACT; pintarActualizar();
  setTimeout(() => revisarVersion(true), 2500);
  document.addEventListener('visibilitychange', () => { if(!document.hidden) revisarVersion(true); });
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); if(enApp()) return; pedidoInstalar = e; $('#btnInstalar').hidden = false; });
$('#btnInstalar').onclick = async () => {
  if($('#btnInstalar').classList.contains('act')) return actualizarApp();
  if(!pedidoInstalar) return; pedidoInstalar.prompt(); const r = await pedidoInstalar.userChoice; if(r.outcome==='accepted') aviso('App (X,Y,Z) instalada'); pedidoInstalar = null; $('#btnInstalar').hidden = true; };
window.addEventListener('appinstalled', () => { $('#btnInstalar').hidden = true; });
if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  const habia = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js', {updateViaCache: 'none'}).then(r => r.update()).catch(() => {});
  let recargado = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(!habia || recargado) return;
    if(!abiertas.size){ recargado = true; location.reload(); }   // versión nueva: recarga sola si no hay herramientas abiertas
    else aviso('Hay una versión nueva del hub: recarga para verla');
  });
}

const inicial = location.hash.slice(1);
if(inicial==='pedidos') mostrar('pedidos');
if(token){ pintarDrive(); listar(); cargarPedidos(); }   // sesión guardada todavía vigente
iniciarTrabajos().then(() => { if(!abiertas.size && inicial && TOOLS.some(t => t.id===inicial)) abrir(inicial); });
</script>
