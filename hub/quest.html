<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quest · HUB</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<main class="shell" id="app"></main>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
mountChrome("quest");

const orden = { alta: 0, media: 1, baja: 2 };
const quests = [...DB.quests].sort(
  (a, b) => (orden[a.prioridad] ?? 9) - (orden[b.prioridad] ?? 9)
);

document.getElementById("app").innerHTML =
  secHead("Módulo 04", "<em>Quest</em>", "Objetivos y pendientes, ordenados por prioridad.") +
  tabla(quests, [
    { key: "id",        label: "ID",         cls: "id" },
    { key: "titulo",    label: "Objetivo",   cls: "nombre" },
    { key: "prioridad", label: "Prioridad",  render: r => prio(r.prioridad) },
    { key: "estado",    label: "Estado",     render: r => badge(r.estado) },
    { key: "nota",      label: "Nota",       cls: "nota" }
  ], "Todavía no hay quests cargadas.");
</script>

</body>
</html>
