<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HUB · BASTIAN.XYZ</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<main class="shell" id="app"></main>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
mountChrome("menu");

const total = DB.items.length + DB.toolbox.length + DB.quests.length;

const CARDS = [
  { n: "01", href: "stats.html",   t: "Stats",   d: "Resumen con todo: totales, estados y avance general.", c: total + " registros" },
  { n: "02", href: "items.html",   t: "Ítems",   d: "Todo lo que vayas agregando. Este es el cajón grande.", c: DB.items.length + " ítems" },
  { n: "03", href: "toolbox.html", t: "Toolbox", d: "Las herramientas que ya tenemos integradas y andando.", c: DB.toolbox.length + " herramientas" },
  { n: "04", href: "quest.html",   t: "Quest",   d: "Objetivos y pendientes. Se edita sobre la marcha.",     c: DB.quests.length + " quests" }
];

document.getElementById("app").innerHTML =
  secHead("Índice general", "Menú <em>principal</em>", "Cuatro módulos. Todo sale de data.js.") +
  `<div class="menu-grid">` + CARDS.map(c => `
    <a class="menu-card" href="${c.href}">
      <div class="mc-num">${c.n}</div>
      <div class="mc-title">${esc(c.t)}</div>
      <div class="mc-desc">${esc(c.d)}</div>
      <div class="mc-count">${esc(c.c)}</div>
    </a>`).join("") + `</div>`;
</script>

</body>
</html>
