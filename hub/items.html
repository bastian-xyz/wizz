<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ítems · HUB</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<main class="shell" id="app"></main>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
mountChrome("items");

document.getElementById("app").innerHTML =
  secHead("Módulo 02", "<em>Ítems</em>", "Todo lo que vayas agregando. Se edita en data.js → DB.items") +
  tabla(DB.items, [
    { key: "id",        label: "ID",        cls: "id" },
    { key: "nombre",    label: "Nombre",    cls: "nombre" },
    { key: "categoria", label: "Categoría" },
    { key: "estado",    label: "Estado",    render: r => badge(r.estado) },
    { key: "nota",      label: "Nota",      cls: "nota" }
  ], "Todavía no hay ítems. Agregalos en data.js.");
</script>

</body>
</html>
