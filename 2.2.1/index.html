<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XYZ MAKER · BASTIAN.XYZ</title>
<!-- app instalable (X,Y,Z) -->
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<meta name="theme-color" content="#0b1119">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="(X,Y,Z)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --negro:#111827; --panel:rgba(22,31,46,.78); --panel-2:rgba(15,76,92,.18);
  --petroleo:#0F4C5C; --petroleo-br:#17738a; --plata:#9CA3AF; --blanco:#F8FAFC;
  --borde:rgba(156,163,175,.25); --ok:#3fb68b; --err:#e06c6c;
  --barra:52px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--negro);color:var(--blanco);font-family:'Montserrat',sans-serif;overflow:hidden}
body{
  background-image:
    linear-gradient(rgba(15,76,92,.42) 1px,transparent 1px),
    linear-gradient(90deg,rgba(15,76,92,.42) 1px,transparent 1px),
    linear-gradient(rgba(15,76,92,.78) 1px,transparent 1px),
    linear-gradient(90deg,rgba(15,76,92,.78) 1px,transparent 1px);
  background-size:8px 8px,8px 8px,40px 40px,40px 40px;
}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}

/* ---------- barra superior ---------- */
#bar{position:fixed;top:0;left:0;right:0;height:var(--barra);z-index:20;display:flex;align-items:center;gap:10px;
  padding:0 12px;background:rgba(11,17,26,.92);border-bottom:1px solid var(--borde);backdrop-filter:blur(8px)}
#home{display:flex;align-items:center;gap:8px;font-weight:900;letter-spacing:2px;font-size:.82rem;white-space:nowrap;padding:6px 8px;border-radius:4px}
#home span{color:var(--petroleo-br)}
#home:hover{background:var(--panel-2)}
#tabs{flex:1;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0}
#tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:6px;height:34px;padding:0 6px 0 10px;border:1px solid var(--borde);border-radius:4px;
  font-size:.66rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;color:var(--plata);flex:none}
.tab svg.ic{width:15px;height:15px}
.tab.on{color:var(--blanco);border-color:var(--petroleo-br);background:var(--panel-2)}
.tab .x{width:20px;height:20px;display:grid;place-items:center;border-radius:3px;opacity:.6}
.tab .x:hover{opacity:1;background:rgba(224,108,108,.2)}
.ibtn{position:relative;width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--borde);border-radius:4px;flex:none}
.ibtn:hover{border-color:var(--petroleo-br);background:var(--panel-2)}
.ibtn svg{width:19px;height:19px}
.dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--plata)}
.dot.on{background:var(--ok);box-shadow:0 0 6px var(--ok)}

/* ---------- inicio ---------- */
#inicio{position:fixed;inset:var(--barra) 0 0 0;overflow-y:auto;padding:34px 16px 60px}
#inicio .wrap{max-width:980px;margin:0 auto}
.hubver{font:inherit;letter-spacing:inherit;color:#7fd3e3;border:1px solid rgba(127,211,227,.35);border-radius:10px;padding:2px 8px;background:rgba(15,76,92,.25)}
.hubver:hover{border-color:#7fd3e3}
#hlogBg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px}
#hlogBg.on{display:flex}
#hlogBox{width:min(580px,100%);max-height:82vh;overflow:auto;background:#0d141f;border:1px solid var(--petroleo-br);border-radius:8px;padding:18px}
#hlogBox h3{display:flex;justify-content:space-between;align-items:center;font-size:.7rem;letter-spacing:3px;margin-bottom:12px}
#hlogBox h4{font-size:.6rem;letter-spacing:2px;color:var(--plata);margin:14px 0 6px}
.hlg{border-left:2px solid var(--petroleo-br);padding:2px 0 10px 12px;margin-bottom:4px}
.hlg b{font-size:.78rem}.hlg time{font-size:.6rem;color:var(--plata);margin-left:8px}
.hlg ul{margin:6px 0 0 16px;font-size:.68rem;line-height:1.6;color:#d6dde6}
.ref{font-size:.55rem;font-weight:700;letter-spacing:3px;color:rgba(156,163,175,.6);display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ref::after{content:'';flex:1;height:1px;background:var(--borde)}
h1{font-size:clamp(1.5rem,4.5vw,2.4rem);font-weight:900;letter-spacing:2px;margin-bottom:28px}
h1 span{color:var(--petroleo-br)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-flow:dense}}
#inicio{z-index:4}  /* la línea de barrido del tema pasa por detrás del tablero */
.card{position:relative;z-index:4;display:flex;flex-direction:column;padding:0;text-align:left;overflow:hidden;
  background:var(--panel);border:1px solid var(--borde);border-radius:8px;backdrop-filter:blur(8px);transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--petroleo-br);transform:translateY(-2px)}
.card.big{grid-column:span 2}
.card.drop{outline:2px dashed #e8b25c;outline-offset:-6px}
.card .art{height:150px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--borde);
  background:radial-gradient(ellipse at 50% 60%,rgba(23,115,138,.16),transparent 70%)}
.card .art svg{width:86%;height:88%;fill:none;stroke:#7fd3e3;stroke-width:1.3;stroke-linejoin:round;stroke-linecap:round}
.card.big .art svg{width:94%}
.card .bd{position:relative;padding:12px 14px 14px;display:flex;flex-direction:column;gap:2px;flex:1}
.card .bd b{display:flex;align-items:center;gap:7px;font-size:.84rem;font-weight:800;letter-spacing:1px;margin-top:4px}
.card .bd b .mi{width:16px;height:16px;color:var(--petroleo-br);flex:none}
.card small{display:block;margin-top:3px;font-size:.62rem;line-height:1.45;color:var(--plata);font-weight:500}
.card .num{font-size:.55rem;font-weight:700;letter-spacing:2px;color:rgba(156,163,175,.55)}
.card .ver{position:absolute;top:12px;right:14px;font-size:.55rem;font-weight:700;letter-spacing:1px;color:#7fd3e3}
.card .go{margin-top:8px;align-self:flex-start;font-size:.58rem;font-weight:700;letter-spacing:1px;color:#e8b25c;border:1px solid rgba(232,178,92,.45);border-radius:3px;padding:4px 8px}
.card.open::after{content:'';position:absolute;top:12px;left:12px;width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok)}
.card.big{background:linear-gradient(120deg,rgba(15,76,92,.40),var(--panel) 55%)}
.card.big .bd b{font-size:1rem;letter-spacing:3px}
/* CUBIK: piezas que se anidan en la plancha */
.art.nestc .sheet{fill:rgba(127,211,227,.05);stroke:#7fd3e3}
.art.nestc .grid8{stroke:#7fd3e3;stroke-opacity:.12;stroke-width:.8}
.art.nestc .pz{fill:rgba(127,211,227,.14);opacity:0;animation:nz-in 7s ease-out infinite}
.art.nestc .pz circle{fill:#0d141f}
.art.nestc .p1{--x:-40px;--y:-30px;animation-delay:0s}.art.nestc .p2{--x:0;--y:-40px;animation-delay:.35s}.art.nestc .p3{--x:40px;--y:-30px;animation-delay:.7s}
.art.nestc .p4{--x:-40px;--y:30px;animation-delay:1.05s}.art.nestc .p5{--x:0;--y:40px;animation-delay:1.4s}.art.nestc .p6{--x:40px;--y:30px;animation-delay:1.75s}
@keyframes nz-in{0%{opacity:0;transform:translate(var(--x),var(--y))}12%,88%{opacity:1;transform:none}100%{opacity:0;transform:none}}
.art.nestc .laser{fill:#ffd27a;stroke:none;filter:drop-shadow(0 0 4px #e8b25c)}
.art.nestc .tag rect{fill:rgba(232,178,92,.18);stroke:#e8b25c;stroke-width:.8}
.art.nestc .tag text{fill:#e8b25c;stroke:none;font:700 7px Montserrat,sans-serif;letter-spacing:1px}
.art.nestc .tag{animation:nz-tag 7s ease-out infinite}
@keyframes nz-tag{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}
.card:hover .art.nestc .pz,.card:hover .art.nestc .tag{animation-duration:3.5s}
/* DRAFT: dibujo que se traza con cotas y panel de comandos */
.art.drft .gridd{stroke:#7fd3e3;stroke-opacity:.07;stroke-width:.7}
.art.drft .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:dr-ln 8s ease-in-out infinite}
.art.drft .l2{animation-delay:.6s}.art.drft .l3{animation-delay:1.1s}.art.drft .l4{animation-delay:1.5s}
@keyframes dr-ln{0%{stroke-dashoffset:1}22%,86%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.art.drft .dim{stroke:#e8b25c;stroke-width:.9;opacity:0;animation:dr-dim 8s ease-out infinite}
.art.drft .dim text{fill:#e8b25c;stroke:none;font:700 8px Montserrat,sans-serif;text-anchor:middle}
.art.drft .d2{animation-delay:.4s}.art.drft .d3{animation-delay:.8s}
@keyframes dr-dim{0%,28%{opacity:0}36%,86%{opacity:1}100%{opacity:0}}
.art.drft .cur{stroke:#ffd27a;stroke-width:1;animation:dr-cur 8s ease-in-out infinite}
@keyframes dr-cur{0%{transform:translate(70px,112px)}8%{transform:translate(70px,44px)}12%{transform:translate(100px,20px)}16%{transform:translate(220px,20px)}20%{transform:translate(250px,44px)}24%{transform:translate(250px,112px)}32%{transform:translate(184px,70px)}44%{transform:translate(262px,80px)}60%{transform:translate(206px,30px)}86%,100%{transform:translate(160px,126px)}}
.art.drft .panel rect{fill:rgba(13,20,31,.75);stroke:#7fd3e3;stroke-opacity:.5}
.art.drft .pi{stroke:#9CA3AF;stroke-width:1.1}
.art.drft .panel text{fill:#9CA3AF;stroke:none;font:700 6.5px Montserrat,sans-serif;letter-spacing:1px}
.card:hover .art.drft .pi{stroke:#7fd3e3}
/* Herramientas extras: mandala que gira y perforado con gradiente */
.art.genx .mand{transform:translate(70px,70px)}
.art.genx .ring{fill:rgba(127,211,227,.10);stroke:#7fd3e3;stroke-width:1}
.art.genx .r1{animation:gx-rot 24s linear infinite}.art.genx .r2{animation:gx-rot 36s linear infinite reverse}
@keyframes gx-rot{to{transform:rotate(360deg)}}
.art.genx .perf circle{fill:#7fd3e3;stroke:none;animation:gx-pulse 3s ease-in-out infinite;animation-delay:var(--d)}
@keyframes gx-pulse{0%,100%{opacity:.35}50%{opacity:1}}
.card:hover .art.genx .r1{animation-duration:6s}.card:hover .art.genx .r2{animation-duration:9s}
.card .art.crate svg{stroke:#e8b25c;stroke-width:1.4}
.card .art.crate .w{stroke:#c98f3e;stroke-width:1}
.card .art.crate .pl{fill:rgba(156,163,175,.55);stroke:#cbd5e1;stroke-width:.8}
.card .art.crate .sh{fill:rgba(0,0,0,.35);stroke:none;transform-origin:110px 132px;animation:cr-sh 2.6s ease-in-out infinite}
.card .art.crate .bx{animation:cr-bob 2.6s ease-in-out infinite}
@keyframes cr-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes cr-sh{0%,100%{transform:scaleX(1);opacity:1}50%{transform:scaleX(.9);opacity:.7}}
@keyframes cr-hop{from{transform:translateY(0) rotate(0)}to{transform:translateY(-9px) rotate(-1.5deg)}}
@media (prefers-reduced-motion:reduce){.card .art.crate .bx,.card .art.crate .sh{animation:none}}
.card .art.furn svg{stroke:#7fd3e3;stroke-width:1}
.card .art.furn .fc{fill:rgba(127,211,227,.10);stroke:#7fd3e3}
.card .art.furn .fc0{fill:rgba(127,211,227,.18)}.card .art.furn .fc2{fill:rgba(127,211,227,.06)}
.card .art.furn .hd{fill:none;stroke:#7fd3e3;stroke-opacity:.35;stroke-dasharray:2 2}
.card .art.furn .tb{fill:rgba(232,178,92,.35);stroke:#e8b25c;stroke-width:.8}
.card .art.furn .sh{fill:rgba(0,0,0,.35);stroke:none}
.card .art.furn .pn{animation:fx-ex 5s ease-in-out infinite}
@keyframes fx-ex{0%,22%,100%{transform:translate(0,0)}46%,76%{transform:translate(var(--tx),var(--ty))}}
@keyframes fx-hold{to{transform:translate(var(--tx),var(--ty))}}
@media (prefers-reduced-motion:reduce){.card .art.furn .pn{animation:none;transform:translate(calc(var(--tx)*.6),calc(var(--ty)*.6))}}
.card .art.tray svg path{stroke-linejoin:round}
.card:hover .art.crate .bx{animation:cr-hop .5s cubic-bezier(.3,.7,.4,1) infinite alternate}
.card:hover .art.furn .pn{animation:fx-hold .6s ease-out forwards}
.card .art.tray svg path{stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){.art.nestc .pz,.art.nestc .tag{animation:none;opacity:1}.art.drft .ln{animation:none;stroke-dashoffset:0}.art.drft .dim{animation:none;opacity:1}.art.drft .cur{display:none}.art.genx .ring,.art.genx .perf circle{animation:none}}

/* ---------- vistas de herramientas ---------- */
#vistas{position:fixed;inset:var(--barra) 0 0 0;display:none}
#vistas iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--negro);display:none}
#vistas iframe.on{display:block}
#carga{position:fixed;inset:var(--barra) 0 0 0;display:none;place-items:center;font-size:.62rem;letter-spacing:3px;color:var(--plata);z-index:5}
#carga.on{display:grid}

/* ---------- panel Drive ---------- */
#velo{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:29;opacity:0;pointer-events:none;transition:opacity .2s}
#velo.on{opacity:1;pointer-events:auto}
#drive{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);z-index:30;display:flex;flex-direction:column;
  background:#0d141f;border-left:1px solid var(--borde);transform:translateX(100%);transition:transform .25s}
#drive.on{transform:none}
.dhead{display:flex;align-items:center;gap:10px;height:var(--barra);padding:0 12px 0 16px;border-bottom:1px solid var(--borde)}
.dhead b{flex:1;font-size:.72rem;letter-spacing:3px;font-weight:800}
.dbody{flex:1;overflow-y:auto;padding:16px}
.quien{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--borde);border-radius:6px;margin-bottom:14px;font-size:.66rem}
.quien img{width:28px;height:28px;border-radius:50%}
.quien span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--plata)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:4px;
  font-size:.66rem;font-weight:800;letter-spacing:2px;text-transform:uppercase;border:1px solid var(--petroleo-br);background:var(--petroleo)}
.btn:hover{background:var(--petroleo-br)}
.btn.sec{background:transparent;border-color:var(--borde)}
.btn.sec:hover{border-color:var(--petroleo-br);background:var(--panel-2)}
.btn.w{width:100%}
.btn svg{width:16px;height:16px}
.zona{border:1.5px dashed var(--borde);border-radius:6px;padding:20px;text-align:center;font-size:.62rem;letter-spacing:1px;color:var(--plata);margin-bottom:14px;cursor:pointer}
.zona.sobre,.zona:hover{border-color:var(--petroleo-br);color:var(--blanco);background:var(--panel-2)}
.zona svg{width:26px;height:26px;margin:0 auto 8px;color:var(--petroleo-br)}
.filtro{display:flex;gap:8px;margin-bottom:10px}
.filtro input{flex:1;min-width:0;height:36px;padding:0 10px;border-radius:4px;border:1px solid var(--borde);background:rgba(11,17,26,.6);color:var(--blanco);font:inherit;font-size:.72rem}
.filtro input:focus{outline:none;border-color:var(--petroleo-br)}
.lista{display:flex;flex-direction:column;gap:6px}
.arch{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--borde);border-radius:5px;background:var(--panel)}
.arch .ext{width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:4px;background:var(--panel-2);
  font-size:.52rem;font-weight:800;letter-spacing:1px;color:var(--petroleo-br);text-transform:uppercase}
.arch .inf{flex:1;min-width:0}
.arch .inf b{display:block;font-size:.7rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arch .inf small{display:block;font-size:.58rem;color:var(--plata);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arch .acc{display:flex;gap:4px}
.arch.carp{width:100%;text-align:left;cursor:pointer;color:inherit;font:inherit}
.arch.carp:hover{border-color:var(--petroleo-br)}
.arch.carp .ext{color:var(--petroleo-br)}
.arch .ir{color:var(--plata);font-size:1rem;padding:0 6px}
.ruta{font-size:.62rem;color:var(--plata);margin:-2px 0 8px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.ruta button{color:var(--petroleo-br);font:inherit;font-weight:700;padding:2px 0}
.ruta button:hover{text-decoration:underline}
.adj .auto{flex-basis:100%;display:grid;gap:5px;padding:10px 12px;border:1px dashed var(--petroleo-br);border-radius:5px;background:rgba(15,76,92,.12);font-size:.62rem;color:var(--plata)}
.adj .auto b{color:var(--blanco);font-size:.64rem;letter-spacing:.5px}
.adj .auto span{display:flex;gap:6px;align-items:flex-start;background:none;border:0;padding:0}
.adj .auto svg{flex:none;margin-top:1px;color:var(--petroleo-br)}
.arch .acc button{width:32px;height:32px;display:grid;place-items:center;border-radius:4px;color:var(--plata)}
.arch .acc button:hover{background:var(--panel-2);color:var(--blanco)}
.arch .acc svg{width:16px;height:16px}
.msg{font-size:.64rem;color:var(--plata);text-align:center;padding:18px 6px;line-height:1.6}
.msg.err{color:var(--err)}
.intro{font-size:.68rem;line-height:1.7;color:var(--plata);margin-bottom:18px}
#aviso{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);z-index:40;padding:10px 16px;border-radius:5px;
  background:rgba(13,20,31,.97);border:1px solid var(--petroleo-br);font-size:.66rem;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100% - 32px)}
#aviso.on{opacity:1;transform:translate(-50%,0)}
#aviso.err{border-color:var(--err)}

/* ---------- pedidos ---------- */
.ibtn .cnt{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--petroleo-br);font-size:.58rem;font-weight:800;display:grid;place-items:center}
.ibtn .cnt:empty{display:none}
#btnPublicar{display:none;height:38px;padding:0 12px;border-radius:4px;border:1px solid var(--petroleo-br);background:var(--petroleo);font-size:.62rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;align-items:center;gap:6px;flex:none}
#btnPublicar.on{display:inline-flex}
#btnPublicar:hover{background:var(--petroleo-br)}
#btnPublicar svg{width:16px;height:16px}
.resumen{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kpi{padding:12px 14px;text-align:left;background:var(--panel);border:1px solid var(--borde);border-left:3px solid var(--c);border-radius:6px}
.kpi:hover{border-color:var(--petroleo-br);border-left-color:var(--c)}
.kpi b{display:block;font-size:1.4rem;font-weight:900;font-variant-numeric:tabular-nums;color:var(--c)}
.kpi span{font-size:.56rem;font-weight:700;letter-spacing:2px;color:var(--plata);text-transform:uppercase}
#pedidosV{position:fixed;inset:var(--barra) 0 0 0;overflow:auto;padding:24px 16px 60px;display:none}
#pedidosV .wrap{max-width:1200px;margin:0 auto}
.ptop{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.ptop h1{margin:0;flex:1}
.tablero{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.colp{display:flex;flex-direction:column;gap:8px;min-width:0;background:rgba(11,17,26,.55);border:1px solid var(--borde);border-radius:6px;padding:10px}
.colp h3{display:flex;justify-content:space-between;font-size:.6rem;letter-spacing:2px;text-transform:uppercase;color:var(--c);margin-bottom:2px}
.colp h3 span:last-child{color:var(--plata)}
.colp .vacio{font-size:.6rem;color:rgba(156,163,175,.5);text-align:center;padding:14px 0}
.ped{display:grid;gap:6px;text-align:left;width:100%;padding:11px;border-radius:5px;background:var(--panel);border:1px solid var(--borde);border-left:3px solid var(--c)}

<script>/* ===== BARRA DE CARGA C.I.D. · 1.1 =====
   Tarjeta «Procesando» abajo a la izquierda: qué se está haciendo, porcentaje y si se puede seguir navegando.
   Llega rápido a 75 % y el resto avanza con el progreso real (o despacio si no se puede medir).
   La animación corre en el compositor (transform), así sigue moviéndose aunque el cálculo ocupe el hilo. */
window.CARGA = window.CARGA || (function(){
  const css = `#cargaBar{position:fixed;left:0;right:0;top:0;height:3px;z-index:2147483000;pointer-events:none;opacity:0;transition:opacity .25s}
#cargaBar.on{opacity:1;transition-delay:.12s}
#cargaBar i{position:absolute;inset:0;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--carga-a,#17738a),var(--carga-b,#7ff3ff));box-shadow:0 0 10px var(--carga-b,#7ff3ff),0 0 3px var(--carga-b,#7ff3ff)}
#cargaPill{position:fixed;left:14px;bottom:14px;z-index:2147483000;pointer-events:none;opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s;
  width:min(300px,calc(100vw - 28px));padding:11px 14px 12px;border-radius:12px;background:rgba(11,17,26,.94);border:1px solid rgba(156,163,175,.25);
  font:500 12px/1.3 'Montserrat',system-ui,sans-serif;color:#e5e7eb;box-shadow:0 12px 30px rgba(0,0,0,.4);backdrop-filter:blur(6px)}
#cargaPill.on{opacity:1;transform:none;transition-delay:.12s}
#cargaPill .h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#9ca3af}
#cargaPill .h i{width:7px;height:7px;border-radius:50%;background:var(--carga-b,#7ff3ff);box-shadow:0 0 8px var(--carga-b,#7ff3ff);animation:cargaLat 1.1s ease-in-out infinite}
@keyframes cargaLat{50%{opacity:.3}}
#cargaPill .h .p{margin-left:auto;color:var(--carga-b,#7ff3ff);font-variant-numeric:tabular-nums;letter-spacing:.04em;font-size:12px}
#cargaPill .t{margin-top:6px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#cargaPill .m{margin-top:8px;height:3px;border-radius:3px;background:rgba(156,163,175,.22);overflow:hidden}
#cargaPill .m b{display:block;height:100%;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--carga-a,#17738a),var(--carga-b,#7ff3ff))}
#cargaPill .n{margin-top:7px;font-size:11px;color:#9ca3af;max-height:0;opacity:0;overflow:hidden;transition:max-height .3s,opacity .3s}
#cargaPill.largo .n{max-height:30px;opacity:1}`;
  let bar, fill, pill, ptxt, ppct, pmini, pnota, listo = false, t0 = 0;
  function montar(){
    if(listo || !document.body) return listo;
    const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
    bar = document.createElement('div'); bar.id = 'cargaBar'; bar.innerHTML = '<i></i>'; fill = bar.firstChild;
    pill = document.createElement('div'); pill.id = 'cargaPill'; pill.setAttribute('role','status'); pill.setAttribute('aria-live','polite');
    pill.innerHTML = '<div class="h"><i></i>Procesando<span class="p"></span></div><div class="t"></div><div class="m"><b></b></div><div class="n"></div>';
    pmini = pill.querySelector('.m b'); ptxt = pill.querySelector('.t'); ppct = pill.querySelector('.p'); pnota = pill.querySelector('.n');
    document.body.append(bar, pill); listo = true; return true;
  }
  const tareas = new Map(); let seq = 0, fase = 0, tFase = null, tPct = null, tFin = null, objetivo = 0;
  const RAPIDO = 1.6;                    // segundos hasta 75 %
  function mover(v, seg, curva){ if(!montar()) return;
    objetivo = v; const tr = seg ? `transform ${seg}s ${curva||'cubic-bezier(.15,.7,.3,1)'}` : 'none';
    fill.style.transition = pmini.style.transition = tr; fill.style.transform = pmini.style.transform = `scaleX(${v})`; }
  function actual(){ try{ const m = getComputedStyle(fill).transform; if(!m || m==='none') return 0; return +m.split('(')[1].split(',')[0] || 0; }catch(e){ return 0; } }
  function realMin(){ let r = null; tareas.forEach(t => { if(t.real!=null) r = r==null ? t.real : Math.min(r, t.real); }); return r; }
  function etiqueta(){ let el = null; tareas.forEach(t => { if(!el || (t.pri > el.pri) || (t.pri===el.pri && t.k > el.k)) el = t; }); return el ? el.txt : ''; }
  function pintar(){ if(!listo) return; const e = etiqueta(); if(e) ptxt.textContent = e; ppct.textContent = Math.round(actual()*100) + ' %';
    if(tareas.size){ let bloquea = false; tareas.forEach(t => { if(t.nav === false) bloquea = true; });
      pnota.textContent = bloquea ? 'Calculando: la pantalla puede tardar en responder' : 'Puedes seguir navegando mientras termina';
      pill.classList.toggle('largo', performance.now() - t0 > 2500); } }
  function avanzar(){                     // después del tramo rápido: real si se conoce, si no, sigue despacio
    if(!tareas.size || fase < 2) return;
    const r = realMin();
    if(r != null){ const v = .75 + .24*r; if(v > objetivo + .001) mover(v, .45, 'ease-out'); }
    else if(objetivo < .955) mover(.96, 30, 'cubic-bezier(.05,.55,.25,1)');
  }
  function arrancar(){
    clearTimeout(tFin); clearTimeout(tFase); montar(); if(!listo) return;
    if(fase === 0 || objetivo >= 1){ t0 = performance.now(); mover(0, 0); void fill.offsetWidth; }
    fase = 1; mover(Math.max(.75, objetivo), RAPIDO);
    bar.classList.add('on'); pill.classList.add('on');
    tFase = setTimeout(() => { fase = 2; avanzar(); }, RAPIDO*1000);
    clearInterval(tPct); tPct = setInterval(pintar, 120); pintar();
  }
  function terminar(){
    clearTimeout(tFase); mover(1, .25, 'ease-out'); pintar();
    tFin = setTimeout(() => { bar.classList.remove('on'); pill.classList.remove('on', 'largo'); clearInterval(tPct);
      setTimeout(() => { if(!tareas.size){ fase = 0; mover(0, 0); } }, 300); }, 260);
  }
  function inicio(txt, pri, opc){            // opc.nav = false: cálculo que ocupa la pantalla
    const k = ++seq, t = {k, txt: txt || 'Cargando…', real: null, pri: pri || 1, nav: !(opc && opc.nav === false)};
    const vacio = !tareas.size; tareas.set(k, t);
    if(vacio && fase === 0) arrancar(); else if(vacio){ arrancar(); } else pintar();
    let cerrada = false;
    return {
      texto(s){ t.txt = s; pintar(); return this; },
      real(f){ t.real = Math.max(0, Math.min(1, +f || 0)); avanzar(); return this; },
      fin(){ if(cerrada) return; cerrada = true; tareas.delete(k); if(!tareas.size) terminar(); else { avanzar(); pintar(); } }
    };
  }
  async function con(txt, fn, pri, opc){ const t = inicio(txt, pri, opc); try{ return await fn(t); } finally{ t.fin(); } }
  return {inicio, con, activas: () => tareas.size};
})();

      o+='<path d="M'+f.pts.map(p=>fmt(pr(p,s,ox,oyl))).join('L')+'z" fill="rgba(127,211,227,'+al+')" stroke="#7fd3e3" stroke-width="1.2"/>';});
    bends.forEach(f=>{const g=(f.lip?glowB:glowA)[f.i];
      o+='<path d="M'+fmt(pr(f.bend[0],s,ox,oyl))+'L'+fmt(pr(f.bend[1],s,ox,oyl))+'" stroke="'+(g>.05?'#ffd27a':'#e8b25c')+'" stroke-width="'+(1+g*1.6).toFixed(2)+'" stroke-dasharray="3 2.5" stroke-opacity="'+(.75+g*.25).toFixed(2)+'"'+(g>.05?' style="filter:drop-shadow(0 0 '+(g*3).toFixed(1)+'px #e8b25c)"':'')+'/>';});
    svg.innerHTML=o;}
  const clamp=x=>x<0?0:x>1?1:x, smooth=x=>{x=clamp(x);return x*x*(3-2*x);};
  const back=x=>{x=clamp(x);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};  // con rebote
  const bell=x=>x<=0||x>=1?0:Math.sin(Math.PI*x);
  // secuencia escalonada: cada lado empieza un poco después del anterior
  function seq(T,spring){const A=[],B=[],gA=[],gB=[],ord=[3,0,1,2];
    for(let k=0;k<4;k++){const i=ord[k],ta=(T-k*.16)/.55,tb=(T-.85-k*.13)/.45,f=spring?back:smooth;
      A[i]=f(ta)*PI2;B[i]=f(tb)*PI2;gA[i]=bell(ta);gB[i]=bell(tb);}
    return [A,B,gA,gB];}
  let hov=false,tH=0,tLoop=performance.now(),last=null,lastOut=0;
  card.addEventListener('mouseenter',()=>{hov=true;tH=performance.now();});
  card.addEventListener('mouseleave',()=>{hov=false;lastOut=performance.now();tLoop=performance.now()-3600;});   // sale plegada y luego se abre
  function frame(now){if(!artOn()){requestAnimationFrame(frame);return;}let A,B,gA,gB,lift=0;
    if(hov){const T=(now-tH)/1000;
      if(T<.35){ // se aplana rápido para volver a plegarse
        const k=1-smooth(T/.35),c=last||[F4,F4];A=c[0].map(x=>x*k);B=c[1].map(x=>x*k);gA=Z4;gB=Z4;lift=bell(T/.7)*4;}
      else{[A,B,gA,gB]=seq((T-.35)*1.6,true);const Tf=T-.35-1.9/1.6;lift=Tf>0?2+Math.sin(Tf*2.4)*2.2:bell((T-.35)/1.4)*6;}}
    else{const T=((now-tLoop)/1000)%7;
      if(T<5.6){[A,B,gA,gB]=seq(T-.6,false);}
      else{const k=1-smooth((T-5.6)/1.2);A=F4.map(x=>x*k);B=F4.map(x=>x*k);gA=Z4;gB=Z4;}}
    last=[A,B];draw(A,B,lift,gA,gB);requestAnimationFrame(frame);}
  if(red){draw(F4,F4,0,Z4,Z4);}else requestAnimationFrame(frame);
})();
}

const abiertas = new Map();   // id -> {frame, url}

async function htmlDe(t){
  const bin = Uint8Array.from(atob(SRC[t.src]), c => c.charCodeAt(0));
  const st = new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(st).text();
}
async function abrir(id){
  const t = TOOLS.find(x => x.id === id); if(!t) return;
  if(!abiertas.has(id)){
    $('#carga').classList.add('on');
    const tk = CARGA.inicio('Abriendo '+t.name+'…', 3);
    try{
      let html = await htmlDe(t); tk.real(.25);
      html = html.replace('<head>', () => '<head><script>'+PUENTE+'<\/script>');
      // librerías de PDF sin bloquear: la herramienta se muestra aunque el CDN esté lento (se cargan solas al necesitarlas)
      html = html.replace(/<script src="(https:\/\/cdnjs\.cloudflare\.com\/ajax\/libs\/jspdf\/[^"]+)"><\/script>/g, '<script async src="$1"><\/script>');
      if(t.embed) html = html.replace('<head>', `<head><script>window.XYZ_EMBED=${JSON.stringify(t.embed)};<\/script>`);
      const themeURL = new URL('theme.css', location.href).href;
      html = html.includes('</head>') ? html.replace('</head>', `<link rel="stylesheet" href="${themeURL}">\n</head>`) : html;
      const url = URL.createObjectURL(new Blob([html], {type:'text/html'}));
      const f = document.createElement('iframe');
      f.title = t.name; f.src = url;
      f.setAttribute('allow','clipboard-read; clipboard-write; fullscreen');
      // lista apenas la herramienta se puede usar (documento interactivo), sin esperar fuentes ni descargas secundarias
      const listo = new Promise(ok => {
        let hecho = false; const fin = () => { if(hecho) return; hecho = true; clearInterval(iv); ok(f); };
        f.addEventListener('load', fin, {once:true});
        const iv = setInterval(() => { try{ const d = f.contentDocument; if(d && d.URL === url && d.readyState !== 'loading') fin(); }catch(e){} }, 80);
      });
      tk.real(.45); listo.then(() => tk.fin()); setTimeout(() => tk.fin(), 25000);
      $('#vistas').appendChild(f);
      abiertas.set(id, {frame:f, url, listo});
      setTimeout(() => { const v = abiertas.get(id); if(v && !v.cargado) aviso(t.name+' está tardando en cargar · revisa la conexión', true); }, 20000);
      listo.then(() => { const v = abiertas.get(id); if(v) v.cargado = true; });
    }catch(err){ tk.fin(); aviso('No se pudo abrir '+t.name+': '+(err && err.message || err), true); console.error(err); $('#carga').classList.remove('on'); return; }
    $('#carga').classList.remove('on');
  }
  mostrar(id);
  return abiertas.get(id).listo;
}

function iniciarCliente(){
  if(cliente || !window.google?.accounts?.oauth2) return !!cliente;
  cliente = google.accounts.oauth2.initTokenClient({
    client_id: CFG.clientId, scope: CFG.scope,
    callback: async r => {
      if(r.error){ aviso('No se pudo iniciar sesión', true); return; }
      token = r.access_token; tokenVence = Date.now() + (r.expires_in - 60)*1000;
      $('#dotDrive').classList.add('on');
      try{ usuario = await (await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+token}})).json(); }catch(e){}
      pintarDrive(); listar(); alEntrar();
      if(pendiente){ const p=pendiente; pendiente=null; p(); }
    },
    error_callback: e => { if(e.type!=='popup_closed') aviso('Inicio de sesión cancelado', true); }
  });
  return true;
}
let pendiente = null;
function entrar(despues){
  if(!iniciarCliente()){ aviso('Cargando Google… intenta de nuevo', true); return; }
  pendiente = despues || null;
  cliente.requestAccessToken({prompt: token ? '' : 'select_account'});
}
function salir(){
  if(token) google.accounts.oauth2.revoke(token, ()=>{});
  token=null; usuario=null; archivos=[]; $('#dotDrive').classList.remove('on'); pintarDrive();
}
async function api(url, opt={}){
  if(!token || Date.now() > tokenVence){ token=null; $('#dotDrive').classList.remove('on'); throw new Error('sesion'); }
  const r = await fetch(url, {...opt, headers:{...(opt.headers||{}), Authorization:'Bearer '+token}});
  if(r.status === 401){ token=null; $('#dotDrive').classList.remove('on'); throw new Error('sesion'); }
  if(!r.ok){ let m=r.status; try{ m=(await r.json()).error.message; }catch(e){} throw new Error(m); }
  return r;
}

function errSesion(e){
  if(e.message==='sesion'){ pintarDrive(); aviso('La sesión venció, entra de nuevo', true); return true; }
  return false;
}
async function listar(){
  try{
    const q = encodeURIComponent(`'${CFG.carpeta}' in parents and trashed=false`);
    const campos = encodeURIComponent('nextPageToken,files(id,name,mimeType,size,modifiedTime,webViewLink,lastModifyingUser(displayName))');
    let todos=[], pt='';
    do{
      const r = await api(`${API}/files?q=${q}&fields=${campos}&orderBy=modifiedTime desc&pageSize=200&supportsAllDrives=true&includeItemsFromAllDrives=true${pt?'&pageToken='+pt:''}`);
      const j = await r.json(); todos = todos.concat(j.files||[]); pt = j.nextPageToken||'';
    }while(pt);
    archivos = todos; pintarLista();
  }catch(e){
    if(errSesion(e)) return;
    const l=$('#lista'); if(l) l.innerHTML = `<p class="msg err">No se pudo leer la carpeta.<br>${esc(e.message)}</p>`;
  }
}
async function subir(files){
  if(!files.length) return;
  if(!token){ entrar(() => subir(files)); return; }
  let ok=0;
  for(const f of files){
    aviso(`Subiendo ${f.name}…`);
    try{
      const meta = {name:f.name, parents:[CFG.carpeta]};
      const fd = new FormData();
      fd.append('metadata', new Blob([JSON.stringify(meta)],{type:'application/json'}));
      fd.append('file', f);
      await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&supportsAllDrives=true', {method:'POST', body:fd});
      ok++;
    }catch(e){ if(errSesion(e)) return; aviso(`Error con ${f.name}: ${e.message}`, true); }
  }
  if(ok) aviso(ok===1 ? 'Archivo subido' : `${ok} archivos subidos`);
  listar();
}
async function bajar(id){
  const a = archivos.find(x => x.id===id); if(!a) return;
  try{
    aviso(`Descargando ${a.name}…`);
    const r = await api(`${API}/files/${id}?alt=media&supportsAllDrives=true`);
    const url = URL.createObjectURL(await r.blob());
    const el = Object.assign(document.createElement('a'), {href:url, download:a.name});
    document.body.appendChild(el); el.click(); el.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }catch(e){ if(!errSesion(e)) aviso('No se pudo descargar: '+e.message, true); }
}

const estDe = k => ESTADOS.find(e => e[0]===k) || ESTADOS[0];

async function pedLeer(){
  const q = encodeURIComponent(`name='pedidos.json' and '${CFG.carpeta}' in parents and trashed=false`);
  const j = await (await api(`${API}/files?q=${q}&fields=files(id)&supportsAllDrives=true&includeItemsFromAllDrives=true`)).json();
  if(j.files && j.files.length){
    PED.fileId = j.files[0].id;
    const d = await (await api(`${API}/files/${PED.fileId}?alt=media&supportsAllDrives=true`)).json();
    PED.data = Object.assign({v:1, seq:{}, pedidos:[]}, d);
  } else { PED.fileId = null; PED.data = {v:1, seq:{}, pedidos:[]}; }
  PED.cargado = true; PED.error = '';

async function pedGuardar(){
  const body = JSON.stringify(PED.data, null, 1);
  if(PED.fileId){
    await api(`https://www.googleapis.com/upload/drive/v3/files/${PED.fileId}?uploadType=media&supportsAllDrives=true`, {method:'PATCH', headers:{'Content-Type':'application/json'}, body});
  } else {
    const fd = new FormData();
    fd.append('metadata', new Blob([JSON.stringify({name:'pedidos.json', parents:[CFG.carpeta], mimeType:'application/json'})], {type:'application/json'}));
    fd.append('file', new Blob([body], {type:'application/json'}));
    PED.fileId = (await (await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&supportsAllDrives=true&fields=id', {method:'POST', body:fd})).json()).id;
  }
}
let cola = Promise.resolve();
/* Relee la última versión, aplica el cambio y guarda: así no se pisan cambios del resto del equipo */
function mutar(fn){
  const p = cola.then(async () => { await pedLeer(); const r = fn(PED.data); await pedGuardar(); pintarPedidos(); return r; });

}
async function cargarPedidos(){
  if(!sesionOk()){ pintarPedidos(); return; }

async function crearCarpeta(nombre, padre){
  const r = await api(`${API}/files?supportsAllDrives=true&fields=id`, {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name:nombre, mimeType:'application/vnd.google-apps.folder', parents:[padre||CFG.carpeta]})});
  return (await r.json()).id;
}
async function subirA(file, parent){
  const fd = new FormData();
  fd.append('metadata', new Blob([JSON.stringify({name:file.name, parents:[parent]})], {type:'application/json'}));
  fd.append('file', file);
  const r = await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&supportsAllDrives=true&fields=id,name', {method:'POST', body:fd});
  try{ return await r.json(); }catch(e){ return {}; }
}
async function listarEn(parent){
  const q = encodeURIComponent(`'${parent}' in parents and trashed=false`);
  const f = encodeURIComponent('files(id,name,mimeType,size,modifiedTime,webViewLink)');
  return (await (await api(`${API}/files?q=${q}&fields=${f}&orderBy=modifiedTime desc&supportsAllDrives=true&includeItemsFromAllDrives=true`)).json()).files || [];
}

function adjuntarAPieza(pid, i, f){
  const p = PED.data.pedidos.find(x => x.id===pid); if(!p || !f) return;
  conSesion(async () => {
    try{
      let carpeta = p.carpeta;
      if(!carpeta){ carpeta = await crearCarpeta(p.id); }
      aviso('Subiendo '+f.name+'…');
      const r = await subirA(f, carpeta);
      await mutar(d => { const q = d.pedidos.find(x => x.id===pid); if(!q || !q.piezas[i]) return; q.carpeta = carpeta; q.piezas[i].arch = {id:r.id, name:f.name};
        (q.hist=q.hist||[]).push({t:ahora(), q:yo(), a:'Archivo en '+(q.piezas[i].n||'pieza')+': '+f.name}); });
      aviso('Archivo adjunto a la pieza'); cargarArchDet();
    }catch(err){ if(!errSesion(err)) aviso('No se pudo subir: '+err.message, true); }
  });
}
async function bajarArchivo(id, nombre){
  try{
    const r = await api(`${API}/files/${id}?alt=media&supportsAllDrives=true`);
    const url = URL.createObjectURL(await r.blob());
    const el = Object.assign(document.createElement('a'), {href:url, download:nombre});
    document.body.appendChild(el); el.click(); el.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
  }catch(e){ if(!errSesion(e)) aviso('No se pudo descargar: '+e.message, true); }
}
function copiar(t){
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(() => aviso('Correo copiado'), () => aviso('No se pudo copiar', true));
  else aviso('No se pudo copiar', true);
}

/* lleva un nombre de material de las herramientas al de la lista (si no calza, queda tal cual) */
function normMat(m){
  if(!m) return ''; const t = m.toLowerCase();
  if(/inox/.test(t)) return /430/.test(t) ? 'Acero inoxidable 430' : /316/.test(t) ? 'Acero inoxidable 316' : /201/.test(t) ? m : 'Acero inoxidable 304';
  if(/galv/.test(t)) return 'Acero galvanizado';
  if(/alum/.test(t)) return 'Aluminio';
  if(/cobre/.test(t)) return 'Cobre';
  if(/lat[oó]n/.test(t)) return 'Latón';
  if(/carbono|laf|lac|a36|negro/.test(t)) return /lac|a36/.test(t) ? 'Acero carbono LAC' : 'Acero carbono LAF';
  return m;
}
function optsMat(sel, vacio){
  const xs = Object.keys(MATERIALES); if(sel && !xs.includes(sel)) xs.push(sel);
  return (vacio ? `<option value="">${vacio}</option>` : '') + xs.map(m => `<option${m===sel?' selected':''}>${esc(m)}</option>`).join('');
}
function optsEsp(mat, sel){
  const xs = (MATERIALES[mat] || ESP_TODOS).slice(); const v = sel===''||sel==null ? '' : +sel;
  if(v!=='' && !xs.includes(v)) { xs.push(v); xs.sort((a,b)=>a-b); }
  return `<option value="">mm</option>` + xs.map(e => `<option value="${e}"${e===v?' selected':''}>${fmtE(e)} mm</option>`).join('');
}

    const archPz = piezas.map(z => z._file), srcPz = piezas.map(z => z._src); piezas.forEach(z => { delete z._file; delete z._src; });
    const base = {origen:pubOrigen, cliente:cli, correo:$('#pMail').value.trim(), desc:$('#pDesc').value.trim(), material:$('#pMat').value.trim(),
      total:$('#pTot').value.trim(), estado:'cotizado', piezas, ficha:pubFicha, mail:$('#pCuerpo').value, creado:ahora(), por:yo(), carpeta:null};
    if(base.material) LS.set('hub-ult-mat', base.material);
    const pref = PREFIJO[pubOrigen] || 'PED';
    const id = await mutar(d => {
      d.seq[pref] = (d.seq[pref]||0) + 1;
      const id = `${pref}-${String(d.seq[pref]).padStart(4,'0')}`;
      d.pedidos.push({id, ...base, hist:[{t:ahora(), q:yo(), a:'Publicado'}]});
      return id;
    });
    let paq = null;
    try{ const w = abiertas.get(pubOrigen)?.frame.contentWindow;   // la herramienta necesita la librería de PDF para sus informes
      if(w && pubPaq && !(w.jspdf && w.jspdf.jsPDF)){ tk.texto('Preparando informes…'); await cargarJsPDF(); w.jspdf = window.jspdf; } }catch(e){}
    if(pubPaq){
      try{ paq = await pubPaq(m => { btn.textContent = m+'…'; tk.texto(m+'…'); }); }
      catch(e){ aviso('No se pudo armar el paquete de la herramienta: '+e.message, true); }
    }
    btn.textContent = 'Creando carpetas…'; tk.texto('Creando carpetas…').real(.05);
    const carpeta = await crearCarpeta(id), subidos = [], avisos = [...(paq?.avisos||[])];
    let hechos = 0;
    const total = pubAdj.length + archPz.filter(Boolean).length + (paq ? paq.informes.length + paq.planchas.length + paq.piezas.length + (paq.extras||[]).length : 0) + 1;
    const subir = async (f, dest) => { btn.textContent = `Subiendo ${++hechos}/${total} · ${f.name}`; tk.texto(`Subiendo ${hechos}/${total} · ${f.name}`).real(.05 + .9*(hechos-1)/total);
      const r = await subirA(f, dest); tk.real(.05 + .9*hechos/total); return r; };
    for(const f of pubAdj) await subir(f, carpeta);
    for(let i=0;i<archPz.length;i++){ const f = archPz[i]; if(!f) continue; const r = await subir(f, carpeta); subidos.push([i, {id:r.id, name:f.name}]); }
    let nPzDxf = 0;
    if(paq){
      if(paq.planchas.length){ const c = await crearCarpeta('02 DXF planchas', carpeta); for(const f of paq.planchas) await subir(f, c); }
      const pzs = paq.piezas.map(z => ({...z, fila: srcPz.indexOf(z.idx)})).filter(z => z.fila>=0);
      if(pzs.length){
        const raiz = await crearCarpeta('03 DXF piezas', carpeta), sub = {};
        for(const z of pzs){
          const row = piezas[z.fila], cn = carpetaDe(row);
          if(!sub[cn]) sub[cn] = await crearCarpeta(cn, raiz);
          const f = new File([z.file], nombrePz(z.fila, row, z.file), {type:z.file.type});
          const r = await subir(f, sub[cn]); nPzDxf++;
          if(!archPz[z.fila]) subidos.push([z.fila, {id:r.id, name:f.name, carpeta:cn}]);
          for(const x of (paq.extras||[]).filter(x => x.idx===z.idx)) await subir(new File([x.file], String(z.fila+1).padStart(2,'0')+'_'+x.file.name, {type:x.file.type}), sub[cn]);
        }
      }
    }
    // orden de trabajo con los archivos ya enlazados
    const inf = await crearCarpeta('01 Informes', carpeta);
    try{
      btn.textContent = 'Orden de trabajo…';
      const ped = {id, ...base, piezas: piezas.map((z,i) => { const a = subidos.find(x => x[0]===i); return a ? {...z, arch:a[1]} : z; })};
      await subir(await ordenTrabajo(ped), inf);
    }catch(e){ avisos.push('No se generó la orden de trabajo: '+e.message); }
    if(paq) for(const f of paq.informes) await subir(f, inf);
    const nInf = 1 + (paq ? paq.informes.length : 0);
    await mutar(d => { const q = d.pedidos.find(x => x.id===id); if(!q) return; q.carpeta = carpeta; subidos.forEach(([i,a]) => { if(q.piezas[i]) q.piezas[i].arch = a; });
      (q.hist=q.hist||[]).push({t:ahora(), q:yo(), a:`Carpeta C.I.D.: ${nInf} informe${nInf===1?'':'s'}${paq && paq.planchas.length ? ', '+paq.planchas.length+' DXF de planchas' : ''}${nPzDxf ? ', '+nPzDxf+' DXF de piezas' : ''}`}); });
    if(avisos.length){ console.warn('Publicación:', avisos); aviso(avisos[0], true); }
    tk.fin(); cerrarModal(); aviso(`Pedido ${id} publicado`); mostrar('pedidos'); abrirDet(id);
  }catch(err){
    tk.fin();
    btn.disabled = false; btn.textContent = 'Publicar';
    if(!errSesion(err)) aviso('No se pudo publicar: '+err.message, true);
  }
});
