<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XYZ MAKER · BASTIAN.XYZ</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --negro:#111827; --panel:rgba(22,31,46,.78); --panel-2:rgba(15,76,92,.18);
  --petroleo:#0F4C5C; --petroleo-br:#17738a; --plata:#9CA3AF; --blanco:#F8FAFC;
  --borde:rgba(156,163,175,.25); --ok:#3fb68b; --err:#e06c6c;
  --barra:52px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--negro);color:var(--blanco);font-family:'Montserrat',sans-serif;overflow:hidden}
body{
  background-image:
    linear-gradient(rgba(15,76,92,.42) 1px,transparent 1px),
    linear-gradient(90deg,rgba(15,76,92,.42) 1px,transparent 1px),
    linear-gradient(rgba(15,76,92,.78) 1px,transparent 1px),
    linear-gradient(90deg,rgba(15,76,92,.78) 1px,transparent 1px);
  background-size:8px 8px,8px 8px,40px 40px,40px 40px;
}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}

/* ---------- barra superior ---------- */
#bar{position:fixed;top:0;left:0;right:0;height:var(--barra);z-index:20;display:flex;align-items:center;gap:10px;
  padding:0 12px;background:rgba(11,17,26,.92);border-bottom:1px solid var(--borde);backdrop-filter:blur(8px)}
#home{display:flex;align-items:center;gap:8px;font-weight:900;letter-spacing:2px;font-size:.82rem;white-space:nowrap;padding:6px 8px;border-radius:4px}
#home span{color:var(--petroleo-br)}
#home:hover{background:var(--panel-2)}
#tabs{flex:1;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0}
#tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:6px;height:34px;padding:0 6px 0 10px;border:1px solid var(--borde);border-radius:4px;
  font-size:.66rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;color:var(--plata);flex:none}
.tab svg.ic{width:15px;height:15px}
.tab.on{color:var(--blanco);border-color:var(--petroleo-br);background:var(--panel-2)}
.tab .x{width:20px;height:20px;display:grid;place-items:center;border-radius:3px;opacity:.6}
.tab .x:hover{opacity:1;background:rgba(224,108,108,.2)}
.ibtn{position:relative;width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--borde);border-radius:4px;flex:none}
.ibtn:hover{border-color:var(--petroleo-br);background:var(--panel-2)}
.ibtn svg{width:19px;height:19px}
.dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--plata)}
.dot.on{background:var(--ok);box-shadow:0 0 6px var(--ok)}

/* ---------- inicio ---------- */
#inicio{position:fixed;inset:var(--barra) 0 0 0;overflow-y:auto;padding:34px 16px 60px}
#inicio .wrap{max-width:980px;margin:0 auto}
.ref{font-size:.55rem;font-weight:700;letter-spacing:3px;color:rgba(156,163,175,.6);display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ref::after{content:'';flex:1;height:1px;background:var(--borde)}
h1{font-size:clamp(1.5rem,4.5vw,2.4rem);font-weight:900;letter-spacing:2px;margin-bottom:28px}
h1 span{color:var(--petroleo-br)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{position:relative;display:flex;flex-direction:column;gap:14px;min-height:132px;padding:16px;text-align:left;
  background:var(--panel);border:1px solid var(--borde);border-radius:6px;backdrop-filter:blur(8px);transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--petroleo-br);transform:translateY(-2px)}
.card .ic{width:30px;height:30px;color:var(--petroleo-br)}
.card b{display:block;font-size:.82rem;font-weight:800;letter-spacing:1px}
.card small{display:block;margin-top:4px;font-size:.62rem;color:var(--plata);font-weight:500}
.card .num{position:absolute;top:12px;right:14px;font-size:.55rem;font-weight:700;letter-spacing:2px;color:rgba(156,163,175,.45)}
.card.main{grid-column:1/-1;flex-direction:row;align-items:center;gap:20px;min-height:116px;
  background:linear-gradient(120deg,rgba(15,76,92,.45),var(--panel) 60%)}
.card.main .ic{width:52px;height:52px}
.card.main b{font-size:1.15rem;letter-spacing:3px}
.card.open::after{content:'';position:absolute;bottom:12px;right:14px;width:7px;height:7px;border-radius:50%;background:var(--ok)}

/* ---------- vistas de herramientas ---------- */
#vistas{position:fixed;inset:var(--barra) 0 0 0;display:none}
#vistas iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--negro);display:none}
#vistas iframe.on{display:block}
#carga{position:fixed;inset:var(--barra) 0 0 0;display:none;place-items:center;font-size:.62rem;letter-spacing:3px;color:var(--plata);z-index:5}
#carga.on{display:grid}

/* ---------- panel Drive ---------- */
#velo{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:29;opacity:0;pointer-events:none;transition:opacity .2s}
#velo.on{opacity:1;pointer-events:auto}
#drive{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);z-index:30;display:flex;flex-direction:column;
  background:#0d141f;border-left:1px solid var(--borde);transform:translateX(100%);transition:transform .25s}
#drive.on{transform:none}
.dhead{display:flex;align-items:center;gap:10px;height:var(--barra);padding:0 12px 0 16px;border-bottom:1px solid var(--borde)}
.dhead b{flex:1;font-size:.72rem;letter-spacing:3px;font-weight:800}
.dbody{flex:1;overflow-y:auto;padding:16px}
.quien{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--borde);border-radius:6px;margin-bottom:14px;font-size:.66rem}
.quien img{width:28px;height:28px;border-radius:50%}
.quien span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--plata)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:4px;
  font-size:.66rem;font-weight:800;letter-spacing:2px;text-transform:uppercase;border:1px solid var(--petroleo-br);background:var(--petroleo)}
.btn:hover{background:var(--petroleo-br)}
.btn.sec{background:transparent;border-color:var(--borde)}
.btn.sec:hover{border-color:var(--petroleo-br);background:var(--panel-2)}
.btn.w{width:100%}
.btn svg{width:16px;height:16px}
.zona{border:1.5px dashed var(--borde);border-radius:6px;padding:20px;text-align:center;font-size:.62rem;letter-spacing:1px;color:var(--plata);margin-bottom:14px;cursor:pointer}
.zona.sobre,.zona:hover{border-color:var(--petroleo-br);color:var(--blanco);background:var(--panel-2)}
.zona svg{width:26px;height:26px;margin:0 auto 8px;color:var(--petroleo-br)}
.filtro{display:flex;gap:8px;margin-bottom:10px}
.filtro input{flex:1;min-width:0;height:36px;padding:0 10px;border-radius:4px;border:1px solid var(--borde);background:rgba(11,17,26,.6);color:var(--blanco);font:inherit;font-size:.72rem}
.filtro input:focus{outline:none;border-color:var(--petroleo-br)}
.lista{display:flex;flex-direction:column;gap:6px}
.arch{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--borde);border-radius:5px;background:var(--panel)}
.arch .ext{width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:4px;background:var(--panel-2);
  font-size:.52rem;font-weight:800;letter-spacing:1px;color:var(--petroleo-br);text-transform:uppercase}
.arch .inf{flex:1;min-width:0}
.arch .inf b{display:block;font-size:.7rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arch .inf small{display:block;font-size:.58rem;color:var(--plata);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arch .acc{display:flex;gap:4px}
.arch .acc button{width:32px;height:32px;display:grid;place-items:center;border-radius:4px;color:var(--plata)}
.arch .acc button:hover{background:var(--panel-2);color:var(--blanco)}
.arch .acc svg{width:16px;height:16px}
.msg{font-size:.64rem;color:var(--plata);text-align:center;padding:18px 6px;line-height:1.6}
.msg.err{color:var(--err)}
.intro{font-size:.68rem;line-height:1.7;color:var(--plata);margin-bottom:18px}
#aviso{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);z-index:40;padding:10px 16px;border-radius:5px;
  background:rgba(13,20,31,.97);border:1px solid var(--petroleo-br);font-size:.66rem;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100% - 32px)}
#aviso.on{opacity:1;transform:translate(-50%,0)}
#aviso.err{border-color:var(--err)}

/* ---------- pedidos ---------- */
.ibtn .cnt{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--petroleo-br);font-size:.58rem;font-weight:800;display:grid;place-items:center}
.ibtn .cnt:empty{display:none}
#btnPublicar{display:none;height:38px;padding:0 12px;border-radius:4px;border:1px solid var(--petroleo-br);background:var(--petroleo);font-size:.62rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;align-items:center;gap:6px;flex:none}
#btnPublicar.on{display:inline-flex}
#btnPublicar:hover{background:var(--petroleo-br)}
#btnPublicar svg{width:16px;height:16px}
.resumen{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kpi{padding:12px 14px;text-align:left;background:var(--panel);border:1px solid var(--borde);border-left:3px solid var(--c);border-radius:6px}
.kpi:hover{border-color:var(--petroleo-br);border-left-color:var(--c)}
.kpi b{display:block;font-size:1.4rem;font-weight:900;font-variant-numeric:tabular-nums;color:var(--c)}
.kpi span{font-size:.56rem;font-weight:700;letter-spacing:2px;color:var(--plata);text-transform:uppercase}
#pedidosV{position:fixed;inset:var(--barra) 0 0 0;overflow:auto;padding:24px 16px 60px;display:none}
#pedidosV .wrap{max-width:1200px;margin:0 auto}
.ptop{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.ptop h1{margin:0;flex:1}
.tablero{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.colp{display:flex;flex-direction:column;gap:8px;min-width:0;background:rgba(11,17,26,.55);border:1px solid var(--borde);border-radius:6px;padding:10px}
.colp h3{display:flex;justify-content:space-between;font-size:.6rem;letter-spacing:2px;text-transform:uppercase;color:var(--c);margin-bottom:2px}
.colp h3 span:last-child{color:var(--plata)}
.colp .vacio{font-size:.6rem;color:rgba(156,163,175,.5);text-align:center;padding:14px 0}
.ped{display:grid;gap:6px;text-align:left;width:100%;padding:11px;border-radius:5px;background:var(--panel);border:1px solid var(--borde);border-left:3px solid var(--c)}
.ped:hover{border-color:var(--petroleo-br);border-left-color:var(--c)}
.ped small{font-size:.58rem;color:var(--plata)}
.ped .idp{font-size:.56rem;letter-spacing:1px;color:var(--plata);font-variant-numeric:tabular-nums}
.ped b{font-size:.74rem;font-weight:800}
.prog{height:5px;border-radius:3px;background:rgba(156,163,175,.18);overflow:hidden}
.prog i{display:block;height:100%;background:var(--c,var(--petroleo-br))}
.modal{position:fixed;inset:0;z-index:35;display:none;place-items:center;padding:16px;background:rgba(0,0,0,.6)}
.modal.on{display:grid}
.mcaja{width:min(760px,100%);max-height:calc(100vh - 32px);overflow:auto;background:#0d141f;border:1px solid var(--petroleo-br);border-radius:8px}
.mhead{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:10px;padding:14px 16px;background:#0d141f;border-bottom:1px solid var(--borde)}
.mhead b{flex:1;font-size:.74rem;letter-spacing:3px;font-weight:800}
.mbody{padding:16px;display:grid;gap:14px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.campo{display:grid;gap:5px;font-size:.58rem;font-weight:700;letter-spacing:1.5px;color:var(--plata);text-transform:uppercase;min-width:0}
.campo input,.campo textarea,.campo select{width:100%;height:38px;padding:0 10px;border-radius:4px;border:1px solid var(--borde);background:rgba(11,17,26,.7);color:var(--blanco);font:500 .78rem 'Montserrat',sans-serif;text-transform:none;letter-spacing:0}
.campo textarea{height:auto;min-height:150px;padding:10px;line-height:1.55;resize:vertical}
.campo input:focus,.campo textarea:focus{outline:none;border-color:var(--petroleo-br)}
.sect{font-size:.58rem;font-weight:800;letter-spacing:2px;color:var(--plata);text-transform:uppercase;display:flex;align-items:center;gap:8px}
.sect::after{content:'';flex:1;height:1px;background:var(--borde)}
.pzs{display:grid;gap:6px}
.pzr{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1.15fr) 82px 108px 34px 30px;gap:6px;align-items:center}
.pzh{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1.15fr) 82px 108px 34px 30px;gap:6px;font-size:.52rem;font-weight:700;letter-spacing:1.5px;color:var(--plata);text-transform:uppercase;padding:0 2px}
.pzr select{height:34px;padding:0 6px;border-radius:4px;border:1px solid var(--borde);background:rgba(11,17,26,.7);color:var(--blanco);font:500 .72rem 'Montserrat',sans-serif;min-width:0;width:100%}
.pzr select:focus{outline:none;border-color:var(--petroleo-br)}
.pzr .qty{display:grid;grid-template-columns:30px minmax(0,1fr) 30px;height:34px;border:1px solid var(--borde);border-radius:4px;overflow:hidden;background:rgba(11,17,26,.7)}
.pzr .qty:focus-within{border-color:var(--petroleo-br)}
.pzr .qty button{color:var(--plata);font-size:1rem;font-weight:700;line-height:1}
.pzr .qty button:hover{color:var(--blanco);background:rgba(23,115,138,.25)}
.pzr .qty input{height:100%;border:0;border-left:1px solid var(--borde);border-right:1px solid var(--borde);border-radius:0;background:transparent;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;padding:0 2px;-moz-appearance:textfield}
.pzr .qty input::-webkit-outer-spin-button,.pzr .qty input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.pzr .clip{height:34px;display:grid;place-items:center;border:1px solid var(--borde);border-radius:4px;color:var(--plata)}
.pzr .clip.on{border-color:var(--petroleo-br);color:#7fd3e3;background:rgba(23,115,138,.15)}
.pzr .clip svg{width:15px;height:15px}
.pzr .fnm{grid-column:1/-1;font-size:.58rem;color:#7fd3e3;margin:-2px 0 2px 2px;display:flex;gap:6px;align-items:center}
.pzr .fnm button{color:var(--plata);font-size:.6rem}
.pz .arch-pz{display:inline-flex;align-items:center;gap:4px;margin-top:3px;font-size:.58rem;color:#7fd3e3;text-decoration:none}
.pz .arch-pz:hover{text-decoration:underline}
.pz .pzclip{width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:4px;color:var(--plata)}
.pz .pzclip:hover{color:var(--blanco);background:rgba(23,115,138,.18)}
.pz .pzclip svg{width:15px;height:15px}
.pzr input{height:34px;padding:0 8px;border-radius:4px;border:1px solid var(--borde);background:rgba(11,17,26,.7);color:var(--blanco);font:500 .74rem 'Montserrat',sans-serif;min-width:0}
.pzr input:focus{outline:none;border-color:var(--petroleo-br)}
.pzr [data-quitar]{color:var(--plata);border-radius:4px;height:34px}
.pzr [data-quitar]:hover{color:var(--err);background:rgba(224,108,108,.12)}
.adj{display:flex;flex-wrap:wrap;gap:6px}
.adj span{font-size:.6rem;padding:5px 8px;border:1px solid var(--borde);border-radius:4px;display:inline-flex;gap:6px;align-items:center}
.adj span button{color:var(--plata)}
.mfoot{position:sticky;bottom:0;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 16px;background:#0d141f;border-top:1px solid var(--borde)}
.det{display:grid;grid-template-columns:1fr 260px;gap:16px}
.pz{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--borde);font-size:.74rem;cursor:pointer}
.pz input{width:18px;height:18px;accent-color:var(--ok);flex:none;cursor:pointer}
.pz .nm{flex:1;min-width:0}
.pz .nm small{display:block;font-size:.58rem;color:var(--plata);margin-top:2px}
.pz.ok .nm{color:var(--plata);text-decoration:line-through}
.pz .q{font-size:.66rem;font-weight:800;color:var(--plata);font-variant-numeric:tabular-nums}
.estados{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.estados button{height:32px;border:1px solid var(--borde);border-radius:4px;font-size:.56rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--plata)}
.estados button.on{color:var(--blanco);border-color:var(--c);background:rgba(23,115,138,.15)}
.hist{font-size:.6rem;color:var(--plata);line-height:1.8}
.hist b{color:var(--blanco);font-weight:600}
.kv{display:grid;gap:4px;font-size:.66rem}
.kv div{display:flex;justify-content:space-between;gap:10px}
.kv span{color:var(--plata)}
.kv b{text-align:right;overflow-wrap:anywhere}
@media (max-width:700px){
  .resumen{grid-template-columns:repeat(2,1fr)}
  .f2,.det{grid-template-columns:1fr}
  .pzh{display:none}
  .pzr{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 34px 30px;padding:8px;border:1px solid var(--borde);border-radius:5px}
  .pzr [data-k=n]{grid-area:1/1/2/3}.pzr .clip{grid-area:1/3/2/4}.pzr [data-quitar]{grid-area:1/4/2/5}
  .pzr [data-k=d]{grid-area:2/1/3/5}.pzr [data-k=mat]{grid-area:3/1/4/5}
  .pzr [data-k=e]{grid-area:4/1/5/2}.pzr .qty{grid-area:4/2/5/5}.pzr .fnm{grid-area:5/1/6/5}
  #btnPublicar .t{display:none}
}

a.btn{text-decoration:none;color:inherit}
@media (max-width:600px){
  #home .txt{display:none}
  .grid{grid-template-columns:repeat(2,1fr)}
  .card{min-height:118px;padding:14px}
  .card.main{gap:14px}
  .card.main .ic{width:40px;height:40px}
  .tab .nm{max-width:90px;overflow:hidden;text-overflow:ellipsis}
}
</style>
</head>
<body>

<div id="bar">
  <button id="home" title="Inicio">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="color:var(--petroleo-br)"><path d="M12 2l8 4.5v9L12 20l-8-4.5v-9z"/><path d="M12 11l8-4.5M12 11v9M12 11L4 6.5"/></svg>
    <span class="txt">XYZ<span>·</span>MAKER</span>
  </button>
  <div id="tabs"></div>
  <button id="btnPublicar" title="Convertir esta cotización en pedido"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12l5 5L20 7"/></svg><span class="t">Publicar pedido</span></button>
  <button class="ibtn" id="btnPedidos" title="Pedidos">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="4" width="14" height="17" rx="1.5"/><path d="M9 4V3h6v1M9 10h6M9 14h6M9 18h3"/></svg>
    <i class="cnt" id="cntPed"></i>
  </button>
  <button class="ibtn" id="btnDrive" title="Archivos compartidos">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 10v6M9 13l3-3 3 3"/></svg>
    <i class="dot" id="dotDrive"></i>
  </button>
</div>

<section id="inicio">
  <div class="wrap">
    <div class="ref">CENTRO_DE_CONTROL / HUB 1.3.0</div>
    <h1>XYZ<span>·</span>MAKER</h1>
    <div class="resumen" id="resumen"></div>
    <div class="grid" id="grid"></div>
  </div>
</section>

<section id="pedidosV">
  <div class="wrap">
    <div class="ref">CENTRO_DE_CONTROL / PEDIDOS</div>

/* ================= UTILIDADES ================= */
const $ = s => document.querySelector(s);
const svg = (k, cls='ic') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">${ICON[k]||''}</svg>`;
let avisoT;
function aviso(t, err){ const a=$('#aviso'); a.textContent=t; a.className='on'+(err?' err':''); clearTimeout(avisoT); avisoT=setTimeout(()=>a.className='',3200); }
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ================= INICIO ================= */
function pintarInicio(){
  $('#grid').innerHTML = TOOLS.map((t,i)=>`
    <button class="card${t.main?' main':''}${abiertas.has(t.id)?' open':''}" data-id="${t.id}">
      ${svg(t.icon)}
      <div><b>${esc(t.name)}</b><small>${esc(t.tag)}</small></div>
      ${t.main?'':`<span class="num">${String(i).padStart(2,'0')}</span>`}
    </button>`).join('');
}
$('#grid').addEventListener('click', e => { const c=e.target.closest('.card'); if(c) abrir(c.dataset.id); });

/* ================= PESTAÑAS / IFRAMES ================= */
const abiertas = new Map();   // id -> {frame, url}
let activa = null;

async function htmlDe(t){
  const bin = Uint8Array.from(atob(t.gz), c => c.charCodeAt(0));
  const st = new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(st).text();
}
async function abrir(id){
  const t = TOOLS.find(x => x.id === id); if(!t) return;
  if(!abiertas.has(id)){
    $('#carga').classList.add('on');
    try{
      const html = await htmlDe(t);
      const url = URL.createObjectURL(new Blob([html], {type:'text/html'}));
      const f = document.createElement('iframe');
      f.title = t.name; f.src = url;
      f.setAttribute('allow','clipboard-read; clipboard-write; fullscreen');
      $('#vistas').appendChild(f);
      abiertas.set(id, {frame:f, url});
    }catch(err){ aviso('No se pudo abrir '+t.name, true); console.error(err); $('#carga').classList.remove('on'); return; }
    $('#carga').classList.remove('on');
  }
  mostrar(id);
}
function mostrar(id){
  const esPed = id === 'pedidos';
  activa = esPed ? null : id;
  $('#inicio').style.display = id ? 'none' : '';
  $('#pedidosV').style.display = esPed ? 'block' : 'none';
  $('#vistas').style.display = id && !esPed ? 'block' : 'none';
  abiertas.forEach((v,k) => v.frame.classList.toggle('on', k === id));
  $('#btnPublicar').classList.toggle('on', PUBLICABLES.includes(activa));
  $('#btnPedidos').style.borderColor = esPed ? 'var(--petroleo-br)' : '';
  pintarTabs(); if(!id) pintarInicio();
  if(esPed) cargarPedidos();
  history.replaceState(null,'', id ? '#'+id : location.pathname+location.search);
}
function cerrar(id){
  const v = abiertas.get(id); if(!v) return;
  v.frame.remove(); URL.revokeObjectURL(v.url); abiertas.delete(id);
  if(activa === id){ const ult=[...abiertas.keys()].pop(); mostrar(ult || null); } else pintarTabs();
}
function pintarTabs(){
  $('#tabs').innerHTML = [...abiertas.keys()].map(id => {
    const t = TOOLS.find(x => x.id === id);
    return `<div class="tab${id===activa?' on':''}" data-id="${id}" role="button">${svg(t.icon)}<span class="nm">${esc(t.short||t.name)}</span>
      <button class="x" data-cerrar="${id}" title="Cerrar"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>`;
  }).join('');
}
$('#tabs').addEventListener('click', e => {
  const x = e.target.closest('[data-cerrar]'); if(x){ e.stopPropagation(); cerrar(x.dataset.cerrar); return; }
  const t = e.target.closest('.tab'); if(t) mostrar(t.dataset.id);
});
$('#home').onclick = () => mostrar(null);
window.addEventListener('beforeunload', e => { if(abiertas.size){ e.preventDefault(); e.returnValue=''; } });

/* ================= DRIVE ================= */
let token = null, tokenVence = 0, cliente = null, usuario = null, archivos = [], filtro = '';
const API = 'https://www.googleapis.com/drive/v3';

function abrirDrive(){ $('#drive').classList.add('on'); $('#velo').classList.add('on'); pintarDrive(); if(token && !archivos.length) listar(); }
function cerrarDrive(){ $('#drive').classList.remove('on'); $('#velo').classList.remove('on'); }
$('#btnDrive').onclick = abrirDrive; $('#btnCerrarDrive').onclick = cerrarDrive; $('#velo').onclick = cerrarDrive;
$('#btnRefrescar').onclick = () => token ? listar() : null;

function iniciarCliente(){
  if(cliente || !window.google?.accounts?.oauth2) return !!cliente;
  cliente = google.accounts.oauth2.initTokenClient({
    client_id: CFG.clientId, scope: CFG.scope,
    callback: async r => {
      if(r.error){ aviso('No se pudo iniciar sesión', true); return; }
      token = r.access_token; tokenVence = Date.now() + (r.expires_in - 60)*1000;
      $('#dotDrive').classList.add('on');
      try{ usuario = await (await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+token}})).json(); }catch(e){}
      pintarDrive(); listar(); alEntrar();
      if(pendiente){ const p=pendiente; pendiente=null; p(); }
    },
    error_callback: e => { if(e.type!=='popup_closed') aviso('Inicio de sesión cancelado', true); }
  });
  return true;
}
let pendiente = null;
function entrar(despues){
  if(!iniciarCliente()){ aviso('Cargando Google… intenta de nuevo', true); return; }
  pendiente = despues || null;
  cliente.requestAccessToken({prompt: token ? '' : 'select_account'});
}
function salir(){
  if(token) google.accounts.oauth2.revoke(token, ()=>{});
  token=null; usuario=null; archivos=[]; $('#dotDrive').classList.remove('on'); pintarDrive();
}
async function api(url, opt={}){
  if(!token || Date.now() > tokenVence){ token=null; $('#dotDrive').classList.remove('on'); throw new Error('sesion'); }
  const r = await fetch(url, {...opt, headers:{...(opt.headers||{}), Authorization:'Bearer '+token}});
  if(r.status === 401){ token=null; $('#dotDrive').classList.remove('on'); throw new Error('sesion'); }
  if(!r.ok){ let m=r.status; try{ m=(await r.json()).error.message; }catch(e){} throw new Error(m); }
  return r;
}

function pintarDrive(){
  const b = $('#dbody');
  if(!token){
    b.innerHTML = `<p class="intro">Carpeta compartida del equipo. Entra con tu cuenta Google para ver, subir y bajar archivos.</p>

const fecha = s => new Date(s).toLocaleString('es-CL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const ext = n => { const m=/\.([a-z0-9]{1,5})$/i.exec(n); return m?m[1]:'—'; };

function errSesion(e){
  if(e.message==='sesion'){ pintarDrive(); aviso('La sesión venció, entra de nuevo', true); return true; }
  return false;
}
async function listar(){
  try{
    const q = encodeURIComponent(`'${CFG.carpeta}' in parents and trashed=false`);
    const campos = encodeURIComponent('nextPageToken,files(id,name,mimeType,size,modifiedTime,webViewLink,lastModifyingUser(displayName))');
    let todos=[], pt='';
    do{
      const r = await api(`${API}/files?q=${q}&fields=${campos}&orderBy=modifiedTime desc&pageSize=200&supportsAllDrives=true&includeItemsFromAllDrives=true${pt?'&pageToken='+pt:''}`);
      const j = await r.json(); todos = todos.concat(j.files||[]); pt = j.nextPageToken||'';
    }while(pt);
    archivos = todos; pintarLista();
  }catch(e){
    if(errSesion(e)) return;
    const l=$('#lista'); if(l) l.innerHTML = `<p class="msg err">No se pudo leer la carpeta.<br>${esc(e.message)}</p>`;
  }
}
async function subir(files){
  if(!files.length) return;
  if(!token){ entrar(() => subir(files)); return; }
  let ok=0;
  for(const f of files){
    aviso(`Subiendo ${f.name}…`);
    try{
      const meta = {name:f.name, parents:[CFG.carpeta]};
      const fd = new FormData();
      fd.append('metadata', new Blob([JSON.stringify(meta)],{type:'application/json'}));
      fd.append('file', f);
      await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&supportsAllDrives=true', {method:'POST', body:fd});
      ok++;
    }catch(e){ if(errSesion(e)) return; aviso(`Error con ${f.name}: ${e.message}`, true); }
  }
  if(ok) aviso(ok===1 ? 'Archivo subido' : `${ok} archivos subidos`);
  listar();
}
async function bajar(id){
  const a = archivos.find(x => x.id===id); if(!a) return;
  try{
    aviso(`Descargando ${a.name}…`);
    const r = await api(`${API}/files/${id}?alt=media&supportsAllDrives=true`);
    const url = URL.createObjectURL(await r.blob());
    const el = Object.assign(document.createElement('a'), {href:url, download:a.name});
    document.body.appendChild(el); el.click(); el.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }catch(e){ if(!errSesion(e)) aviso('No se pudo descargar: '+e.message, true); }
}

const conSesion = fn => sesionOk() ? fn() : entrar(fn);
const yo = () => usuario?.given_name || usuario?.name || usuario?.email || 'Equipo';

const avance = p => { let h=0,t=0; (p.piezas||[]).forEach(z => { const q=+z.q||1; t+=q; if(z.ok) h+=q; }); return [h,t]; };

async function pedLeer(){
  const q = encodeURIComponent(`name='pedidos.json' and '${CFG.carpeta}' in parents and trashed=false`);
  const j = await (await api(`${API}/files?q=${q}&fields=files(id)&supportsAllDrives=true&includeItemsFromAllDrives=true`)).json();
  if(j.files && j.files.length){
    PED.fileId = j.files[0].id;
    const d = await (await api(`${API}/files/${PED.fileId}?alt=media&supportsAllDrives=true`)).json();
    PED.data = Object.assign({v:1, seq:{}, pedidos:[]}, d);
  } else { PED.fileId = null; PED.data = {v:1, seq:{}, pedidos:[]}; }
  PED.cargado = true; PED.error = '';
}
async function pedGuardar(){
  const body = JSON.stringify(PED.data, null, 1);
  if(PED.fileId){
    await api(`https://www.googleapis.com/upload/drive/v3/files/${PED.fileId}?uploadType=media&supportsAllDrives=true`, {method:'PATCH', headers:{'Content-Type':'application/json'}, body});
  } else {
    const fd = new FormData();
    fd.append('metadata', new Blob([JSON.stringify({name:'pedidos.json', parents:[CFG.carpeta], mimeType:'application/json'})], {type:'application/json'}));
    fd.append('file', new Blob([body], {type:'application/json'}));
    PED.fileId = (await (await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&supportsAllDrives=true&fields=id', {method:'POST', body:fd})).json()).id;
  }
}
let cola = Promise.resolve();
/* Relee la última versión, aplica el cambio y guarda: así no se pisan cambios del resto del equipo */
function mutar(fn){
  const p = cola.then(async () => { await pedLeer(); const r = fn(PED.data); await pedGuardar(); pintarPedidos(); return r; });
  cola = p.catch(() => {});
  return p;
}
async function cargarPedidos(){
  if(!sesionOk()){ pintarPedidos(); return; }
  try{ await pedLeer(); }catch(e){ if(!errSesion(e)) PED.error = e.message; }
  pintarPedidos();
}
async function crearCarpeta(nombre){
  const r = await api(`${API}/files?supportsAllDrives=true&fields=id`, {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name:nombre, mimeType:'application/vnd.google-apps.folder', parents:[CFG.carpeta]})});
  return (await r.json()).id;
}
async function subirA(file, parent){
  const fd = new FormData();
  fd.append('metadata', new Blob([JSON.stringify({name:file.name, parents:[parent]})], {type:'application/json'}));
  fd.append('file', file);
  const r = await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&supportsAllDrives=true&fields=id,name', {method:'POST', body:fd});
  try{ return await r.json(); }catch(e){ return {}; }
}
async function listarEn(parent){
  const q = encodeURIComponent(`'${parent}' in parents and trashed=false`);
  const f = encodeURIComponent('files(id,name,mimeType,size,modifiedTime,webViewLink)');
  return (await (await api(`${API}/files?q=${q}&fields=${f}&orderBy=modifiedTime desc&supportsAllDrives=true&includeItemsFromAllDrives=true`)).json()).files || [];
}

function adjuntarAPieza(pid, i, f){
  const p = PED.data.pedidos.find(x => x.id===pid); if(!p || !f) return;
  conSesion(async () => {
    try{
      let carpeta = p.carpeta;
      if(!carpeta){ carpeta = await crearCarpeta(p.id); }
      aviso('Subiendo '+f.name+'…');
      const r = await subirA(f, carpeta);
      await mutar(d => { const q = d.pedidos.find(x => x.id===pid); if(!q || !q.piezas[i]) return; q.carpeta = carpeta; q.piezas[i].arch = {id:r.id, name:f.name};
        (q.hist=q.hist||[]).push({t:ahora(), q:yo(), a:'Archivo en '+(q.piezas[i].n||'pieza')+': '+f.name}); });
      aviso('Archivo adjunto a la pieza'); cargarArchDet();
    }catch(err){ if(!errSesion(err)) aviso('No se pudo subir: '+err.message, true); }
  });
}

    const el = Object.assign(document.createElement('a'), {href:url, download:nombre});

  }catch(e){ if(!errSesion(e)) aviso('No se pudo descargar: '+e.message, true); }
}
function copiar(t){
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(() => aviso('Correo copiado'), () => aviso('No se pudo copiar', true));
  else aviso('No se pudo copiar', true);
}

/* lleva un nombre de material de las herramientas al de la lista (si no calza, queda tal cual) */
function normMat(m){
  if(!m) return ''; const t = m.toLowerCase();
  if(/inox/.test(t)) return /430/.test(t) ? 'Acero inoxidable 430' : /316/.test(t) ? 'Acero inoxidable 316' : 'Acero inoxidable 304';
  if(/galv/.test(t)) return 'Acero galvanizado';
  if(/alum/.test(t)) return 'Aluminio';
  if(/cobre/.test(t)) return 'Cobre';
  if(/lat[oó]n/.test(t)) return 'Latón';
  if(/carbono|laf|lac|a36|negro/.test(t)) return /lac|a36/.test(t) ? 'Acero carbono LAC' : 'Acero carbono LAF';
  return m;
}
function optsMat(sel, vacio){
  const xs = Object.keys(MATERIALES); if(sel && !xs.includes(sel)) xs.push(sel);
  return (vacio ? `<option value="">${vacio}</option>` : '') + xs.map(m => `<option${m===sel?' selected':''}>${esc(m)}</option>`).join('');
}
function optsEsp(mat, sel){
  const xs = (MATERIALES[mat] || ESP_TODOS).slice(); const v = sel===''||sel==null ? '' : +sel;
  if(v!=='' && !xs.includes(v)) { xs.push(v); xs.sort((a,b)=>a-b); }
  return `<option value="">mm</option>` + xs.map(e => `<option value="${e}"${e===v?' selected':''}>${fmtE(e)} mm</option>`).join('');
}
const CLIP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11l-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7"/></svg>';
let pzSeq = 0; const pzArch = new Map();   // fila -> File adjunto a esa pieza
function filaPz(z={}){
  const rid = 'r'+(++pzSeq), mat = normMat(z.mat||$('#pMat')?.value||'');
  if(z.file) pzArch.set(rid, z.file);
  return `<div class="pzr" data-rid="${rid}">
    <input placeholder="Pieza" value="${esc(z.n||'')}" data-k="n" aria-label="Pieza">
    <input placeholder="Medida" value="${esc(z.d||'')}" data-k="d" aria-label="Medida">
    <select data-k="mat" aria-label="Material">${optsMat(mat,'Material')}</select>
    <select data-k="e" aria-label="Espesor">${optsEsp(mat, z.e)}</select>
    <div class="qty"><button type="button" data-qd="-1" aria-label="Restar uno">−</button><input type="number" min="1" step="1" inputmode="numeric" data-k="q" value="${Math.max(1,parseInt(z.q)||1)}" aria-label="Cantidad"><button type="button" data-qd="1" aria-label="Sumar uno">+</button></div>
    <button class="clip${z.file?' on':''}" data-clip title="Adjuntar archivo a esta pieza">${CLIP}</button>
    <button title="Quitar pieza" data-quitar><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    ${z.file ? `<div class="fnm">${CLIP.replace('<svg','<svg width="11" height="11"')}${esc(z.file.name)} <button data-quitar-clip title="Quitar archivo">✕</button></div>` : ''}
  </div>`;
}
function pintarFila(row){
  const f = pzArch.get(row.dataset.rid), clip = row.querySelector('.clip'), fn = row.querySelector('.fnm');
  clip.classList.toggle('on', !!f); if(fn) fn.remove();
  if(f) row.insertAdjacentHTML('beforeend', `<div class="fnm">${CLIP.replace('<svg','<svg width="11" height="11"')}${esc(f.name)} <button data-quitar-clip title="Quitar archivo">✕</button></div>`);
}
function leerPzs(){
  return [...document.querySelectorAll('#pPzs .pzr')].map(r => ({
    n: r.querySelector('[data-k=n]').value.trim(), d: r.querySelector('[data-k=d]').value.trim(),
    mat: r.querySelector('[data-k=mat]').value, e: r.querySelector('[data-k=e]').value===''?'':+r.querySelector('[data-k=e]').value,
    q: Math.max(1, parseInt(r.querySelector('[data-k=q]').value)||1), ok:false, _file: pzArch.get(r.dataset.rid)||null }))
    .filter(z => z.n || z.d || z._file);
}
const descPz = z => [z.d, z.mat, z.e!==''&&z.e!=null ? 'e'+fmtE(z.e)+' mm' : ''].filter(Boolean).join(' · ');
function pintarAdj(){
  $('#pAdj').innerHTML = pubAdj.length ? pubAdj.map((f,i) => `<span>${esc(f.name)} <button data-quitar-adj="${i}" title="Quitar">✕</button></span>`).join('') : '<small style="color:var(--plata);font-size:.6rem">Sin archivos adjuntos</small>';
}
function generarMail(){
  if(mailEditado) return;
  const cli = $('#pCli').value.trim(), desc = $('#pDesc').value.trim(), mat = $('#pMat').value.trim(), tot = $('#pTot').value.trim();
  const pz = leerPzs();
  $('#pCuerpo').value =
`Hola${cli ? ' '+cli : ''},

Te envío la cotización${desc ? ' de '+desc.charAt(0).toLowerCase()+desc.slice(1) : ''}${mat ? ' en '+mat : ''}.
${tot ? 'Total: '+tot+'\n' : ''}${pz.length ? '\nDetalle:\n'+pz.map(z => `- ${z.n||'Pieza'}${descPz(z)?' ('+descPz(z)+')':''} ×${z.q}`).join('\n')+'\n' : ''}
Quedo atento a tu confirmación para pasar a producción.

Saludos,
${usuario?.name || ''}`.replace(/\n{3,}/g,'\n\n');
}
function extraer(origen){
  const v = abiertas.get(origen); const w = v && v.frame.contentWindow; const r = {piezas:[], adj:[]};
  if(!w) return r;
  try{
    const d = w.document;
    if(origen==='cubicador' && w.__cubicador){
      const c = w.__cubicador, st = c.state;
      r.cliente = st.jobName || '';
      r.piezas = (st.pieces||[]).map(p => ({n:p.name||'Pieza', d:`${Math.round(p.w)}×${Math.round(p.h)} mm`, q:p.qty||1}));
      const ts = d.querySelectorAll('.qt-kv.total b'); if(ts.length) r.total = ts[ts.length-1].textContent.trim();
      { const n = r.piezas.reduce((a,z)=>a+(+z.q||1),0); r.desc = n ? `Corte láser · ${n} pieza${n===1?'':'s'}` : ''; }
      if(st.result && st.result.sheets && st.result.sheets.length){
        try{ const txt = c.allSheetsDXFText(st.result); r.adj.push(new File([txt], `${(st.jobName||'planchas').replace(/[^\w\-]+/g,'_')}_planchas.dxf`, {type:'application/dxf'})); }catch(e){}
      }
    } else if(origen==='maker'){
      // módulos del Maker: primero el que está a la vista, si no, todos los abiertos
      const fr = [...d.querySelectorAll('#stage iframe')].filter(f => f.contentWindow);
      const vis = fr.filter(f => !f.classList.contains('hide'));
      const data = (vis.length ? vis : fr).map(f => { const cw = f.contentWindow; try{ return cw.__bjPub ? cw.__bjPub() : cw.__xyzPub ? cw.__xyzPub() : null; }catch(e){ return null; } }).filter(x => x && x.piezas && x.piezas.length);
      data.forEach(x => {
        r.piezas.push(...x.piezas);
        if(!r.cliente && x.cliente) r.cliente = x.cliente;
        if(!r.material && x.material) r.material = x.material;
        if(!r.total && x.total) r.total = x.total;
        if(x.dxf) r.adj.push(new File([x.dxf], `${String(x.nombre||'piezas').replace(/[^\w\-]+/g,'_')}.dxf`, {type:'application/dxf'}));
      });
      if(r.piezas.length) { const n = r.piezas.reduce((a,z)=>a+(+z.q||1),0); r.desc = `Chapa plegada · ${n} pieza${n===1?'':'s'}`; }
    } else if(origen==='letras'){
      const pal = (d.getElementById('palabra')?.value||'').trim(), alto = d.getElementById('alto')?.value;
      r.desc = pal ? `Letras corpóreas "${pal}"` : 'Letras corpóreas';
      r.piezas = [...pal.replace(/\s+/g,'')].map(ch => ({n:'Letra '+ch, d: alto ? `alto ${alto} cm` : '', q:1}));
      r.total = (d.getElementById('outVenta')?.textContent||'').trim();
    }
  }catch(e){ console.warn('No se pudieron leer datos de la herramienta', e); }
  return r;
}
function abrirPublicar(origen){
  pubOrigen = origen; mailEditado = false;
  const x = extraer(origen);
  $('#mPubT').textContent = origen==='manual' ? 'NUEVO PEDIDO' : 'PUBLICAR PEDIDO · '+(ORIGEN[origen]||'');
  pzArch.clear(); $('#pCli').value = x.cliente||''; $('#pMail').value = ''; $('#pDesc').value = x.desc||''; $('#pMat').innerHTML = optsMat(normMat(x.material||''),'Elegir…')+'<option>Varios</option>'; $('#pTot').value = x.total||'';
  $('#pPzs').innerHTML = (x.piezas.length ? x.piezas : [{}]).map(filaPz).join('');
  pubAdj = x.adj; pintarAdj(); generarMail();
  $('#pPublicar').disabled = false; $('#pPublicar').textContent = 'Publicar';
  $('#mPub').classList.add('on'); setTimeout(() => $('#pCli').focus(), 50);
}
$('#mPub').addEventListener('input', e => {
  if(e.target.id==='pCuerpo'){ mailEditado = true; return; }
  generarMail();
});
$('#mPub').addEventListener('click', e => {
  const q = e.target.closest('[data-quitar]'); if(q){ q.closest('.pzr').remove(); if(!$('#pPzs').children.length) $('#pPzs').insertAdjacentHTML('beforeend', filaPz()); generarMail(); return; }
  const qa = e.target.closest('[data-quitar-adj]'); if(qa){ pubAdj.splice(+qa.dataset.quitarAdj,1); pintarAdj(); return; }
  const qd = e.target.closest('[data-qd]'); if(qd){ const inp = qd.parentNode.querySelector('input'); inp.value = Math.max(1, (parseInt(inp.value)||1) + (+qd.dataset.qd)); generarMail(); return; }
  const cl = e.target.closest('[data-clip]'); if(cl){ adjDestino = 'fila:'+cl.closest('.pzr').dataset.rid; $('#adjIn').multiple = false; $('#adjIn').click(); return; }
  const qc = e.target.closest('[data-quitar-clip]'); if(qc){ const row = qc.closest('.pzr'); pzArch.delete(row.dataset.rid); pintarFila(row); return; }
});
$('#mPub').addEventListener('change', e => {
  const s = e.target;
  if(s.dataset.k==='q'){ s.value = Math.max(1, parseInt(s.value)||1); }
  if(s.dataset.k==='mat'){ const es = s.closest('.pzr').querySelector('[data-k=e]'); es.innerHTML = optsEsp(s.value, es.value); }
  if(s.id==='pMat' && s.value && s.value!=='Varios'){
    // el material del pedido se copia a las piezas que no tienen uno elegido
    document.querySelectorAll('#pPzs .pzr').forEach(r => { const m = r.querySelector('[data-k=mat]'); if(!m.value){ m.innerHTML = optsMat(s.value,'Material'); const es = r.querySelector('[data-k=e]'); es.innerHTML = optsEsp(s.value, es.value); } });
  }
  generarMail();
});
$('#pAddPz').onclick = () => { $('#pPzs').insertAdjacentHTML('beforeend', filaPz()); $('#pPzs').lastElementChild.querySelector('input').focus(); };
$('#pAddArch').onclick = () => { adjDestino = 'pub'; $('#adjIn').click(); };
$('#pCopiar').onclick = () => copiar($('#pCuerpo').value);
$('#adjIn').onchange = async e => {
  const fs = [...e.target.files]; e.target.value = ''; $('#adjIn').multiple = true;
  if(!fs.length) return;
  if(adjDestino==='pub'){ pubAdj.push(...fs); pintarAdj(); return; }
  if(adjDestino.startsWith('fila:')){ const rid = adjDestino.slice(5), row = document.querySelector(`#pPzs .pzr[data-rid="${rid}"]`); if(row){ pzArch.set(rid, fs[0]); pintarFila(row); } return; }
  if(adjDestino.startsWith('pieza:')){ adjuntarAPieza(detId, +adjDestino.slice(6), fs[0]); return; }
  const p = PED.data.pedidos.find(x => x.id===detId); if(!p) return;
  conSesion(async () => {
    try{
      let carpeta = p.carpeta;
      if(!carpeta){ carpeta = await crearCarpeta(p.id); await mutar(d => { const q = d.pedidos.find(x => x.id===p.id); if(q) q.carpeta = carpeta; }); }
      for(const f of fs){ aviso('Subiendo '+f.name+'…'); await subirA(f, carpeta); }
      aviso(fs.length===1 ? 'Archivo subido' : fs.length+' archivos subidos'); cargarArchDet();
    }catch(err){ if(!errSesion(err)) aviso('No se pudo subir: '+err.message, true); }
  });
};
$('#pPublicar').onclick = () => conSesion(async () => {
  const piezas = leerPzs(), cli = $('#pCli').value.trim();
  if(!cli){ aviso('Falta el nombre del cliente', true); $('#pCli').focus(); return; }
  const btn = $('#pPublicar'); btn.disabled = true; btn.textContent = 'Publicando…';
  try{
    const archPz = piezas.map(z => z._file); piezas.forEach(z => delete z._file);
    const base = {origen:pubOrigen, cliente:cli, correo:$('#pMail').value.trim(), desc:$('#pDesc').value.trim(), material:$('#pMat').value.trim(),
      total:$('#pTot').value.trim(), estado:'cotizado', piezas, mail:$('#pCuerpo').value, creado:ahora(), por:yo(), carpeta:null};
    const pref = PREFIJO[pubOrigen] || 'PED';
    const id = await mutar(d => {
      d.seq[pref] = (d.seq[pref]||0) + 1;
      const id = `${pref}-${String(d.seq[pref]).padStart(4,'0')}`;
      d.pedidos.push({id, ...base, hist:[{t:ahora(), q:yo(), a:'Publicado'}]});
      return id;
    });
    if(pubAdj.length || archPz.some(Boolean)){
      const carpeta = await crearCarpeta(id), subidos = [];
      for(const f of pubAdj){ btn.textContent = 'Subiendo '+f.name+'…'; await subirA(f, carpeta); }
      for(let i=0;i<archPz.length;i++){ const f = archPz[i]; if(!f) continue; btn.textContent = 'Subiendo '+f.name+'…'; const r = await subirA(f, carpeta); subidos.push([i, {id:r.id, name:f.name}]); }
      await mutar(d => { const q = d.pedidos.find(x => x.id===id); if(!q) return; q.carpeta = carpeta; subidos.forEach(([i,a]) => { if(q.piezas[i]) q.piezas[i].arch = a; }); });
    }
    cerrarModal(); aviso(`Pedido ${id} publicado`); mostrar('pedidos'); abrirDet(id);
  }catch(err){
    btn.disabled = false; btn.textContent = 'Publicar';
    if(!errSesion(err)) aviso('No se pudo publicar: '+err.message, true);
  }
});

/* ---------- navegación ---------- */
function cerrarModal(){ document.querySelectorAll('.modal.on').forEach(m => m.classList.remove('on')); detId = null; }
document.addEventListener('click', e => {
  if(e.target.closest('[data-cerrar-modal]') || e.target.classList.contains('modal')){ cerrarModal(); return; }
  if(e.target.closest('[data-ir-pedidos]')){ mostrar('pedidos'); return; }
  if(e.target.closest('[data-entrar]')){ entrar(); return; }
  const pd = e.target.closest('[data-ped]'); if(pd){ abrirDet(pd.dataset.ped); return; }
});
document.addEventListener('keydown', e => { if(e.key==='Escape') cerrarModal(); });
$('#btnPedidos').onclick = () => mostrar('pedidos');
$('#btnPublicar').onclick = () => abrirPublicar(activa);
$('#btnPedNuevo').onclick = () => abrirPublicar('manual');
$('#btnPedRefrescar').onclick = () => sesionOk() ? cargarPedidos() : entrar();
function alEntrar(){ cargarPedidos(); }

/* ================= ARRANQUE ================= */
pintarInicio(); pintarResumen();
const inicial = location.hash.slice(1);
if(inicial==='pedidos') mostrar('pedidos');
else if(inicial && TOOLS.some(t => t.id===inicial)) abrir(inicial);
</script>
